    <text x="374" y="468" font-size="20" fill="#EAF5FF">没有 endl，光标不会自动去下一行</text>
    <text x="755" y="548" text-anchor="middle" font-family="Consolas" font-size="44" font-weight="700" fill="#FFFFFF">HelloWorld!</text>
  </g>
  <g id="conclusion" data-pptx-bounds="330 616 850 58">
    <rect x="330" y="616" width="850" height="58" rx="22" fill="#FFE2ED" />
