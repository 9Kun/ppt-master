<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" data-pptx-page-role="content" font-family="Microsoft YaHei, Arial, sans-serif">
  <rect id="background" data-pptx-role="background" width="1280" height="720" fill="#FFFDF5" />
  <g id="header" data-pptx-bounds="52 38 1000 90">
    <text x="52" y="86" font-family="YouYuan, Microsoft YaHei, sans-serif" font-size="44" font-weight="700" fill="#203044">想一想：两条 cout 会换行吗？</text>
  </g>
  <g id="cout-speaker" data-pptx-bounds="58 188 226 310">
    <circle cx="171" cy="318" r="112" fill="#2E9BFF" />
    <!-- icon: tabler-filled/device-speaker -->
  <g transform="translate(113, 260) scale(4.83333)" fill="#FFFFFF">
    <path d="M17 2a3 3 0 0 1 3 3v14a3 3 0 0 1 -3 3h-10a3 3 0 0 1 -3 -3v-14a3 3 0 0 1 3 -3zm-5 9a4 4 0 0 0 -3.995 3.8l-.005 .2a4 4 0 1 0 4 -4m0 -5a1 1 0 0 0 -1 1v.01a1 1 0 0 0 2 0v-.01a1 1 0 0 0 -1 -1" />
  </g>
    <text x="171" y="472" text-anchor="middle" font-family="Consolas" font-size="28" font-weight="700" fill="#2E9BFF">cout</text>
  </g>
  <g id="string-track" data-pptx-bounds="330 166 850 220">
    <rect x="330" y="166" width="850" height="100" rx="28" fill="#FFFFFF" stroke="#CFE5F8" stroke-width="2" />
    <text x="360" y="228" font-family="Consolas" font-size="28" font-weight="700" fill="#2E9BFF">cout &lt;&lt; "Hello";</text>
    <rect x="330" y="286" width="850" height="100" rx="28" fill="#FFF0D6" />
    <text x="360" y="348" font-family="Consolas" font-size="28" font-weight="700" fill="#FF9F1C">cout &lt;&lt; "World!";</text>
  </g>
  <g id="terminal-result" data-pptx-bounds="330 420 850 170">
