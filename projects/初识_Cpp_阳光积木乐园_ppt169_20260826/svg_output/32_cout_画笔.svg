<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" data-pptx-page-role="content" font-family="Microsoft YaHei, Arial, sans-serif">
  <rect id="background" data-pptx-role="background" width="1280" height="720" fill="#FFFDF5"/>
  <g id="header" data-pptx-bounds="58 42 1000 104"><text x="58" y="90" font-family="YouYuan, Microsoft YaHei, sans-serif" font-size="44" font-weight="700" fill="#203044">一行行 cout，就是画笔</text><text x="58" y="132" font-size="24" fill="#2E9BFF">星号和空格共同决定图案</text></g>
  <g id="code-brush" data-pptx-bounds="84 192 570 398"><rect x="84" y="192" width="570" height="398" rx="42" fill="#17243A"/><circle cx="120" cy="228" r="8" fill="#FF6FA5"/><circle cx="146" cy="228" r="8" fill="#FF9F1C"/><circle cx="172" cy="228" r="8" fill="#22C55E"/><text x="124" y="304" font-family="Consolas, Courier New, monospace" font-size="22" fill="#2E9BFF">cout &lt;&lt; "  *" &lt;&lt; endl;</text><text x="124" y="378" font-family="Consolas, Courier New, monospace" font-size="22" fill="#FF9F1C">cout &lt;&lt; " ***" &lt;&lt; endl;</text><text x="124" y="452" font-family="Consolas, Courier New, monospace" font-size="22" fill="#FF6FA5">cout &lt;&lt; "*****" &lt;&lt; endl;</text><text x="124" y="530" font-size="20" fill="#FFFFFF">每执行一行，右边就增加一层。</text></g>
  <g id="dot-paper" data-pptx-bounds="706 174 484 434"><rect x="706" y="174" width="484" height="434" rx="42" fill="#EAF5FF"/><circle cx="758" cy="226" r="4" fill="#CFE5F8"/><circle cx="810" cy="226" r="4" fill="#CFE5F8"/><circle cx="862" cy="226" r="4" fill="#CFE5F8"/><circle cx="914" cy="226" r="4" fill="#CFE5F8"/><circle cx="966" cy="226" r="4" fill="#CFE5F8"/><circle cx="1018" cy="226" r="4" fill="#CFE5F8"/><circle cx="1070" cy="226" r="4" fill="#CFE5F8"/><circle cx="1122" cy="226" r="4" fill="#CFE5F8"/><text x="948" y="340" text-anchor="middle" font-family="Consolas, Courier New, monospace" font-size="54" font-weight="700" fill="#2E9BFF">*</text><text x="948" y="424" text-anchor="middle" font-family="Consolas, Courier New, monospace" font-size="54" font-weight="700" fill="#FF9F1C">***</text><text x="948" y="508" text-anchor="middle" font-family="Consolas, Courier New, monospace" font-size="54" font-weight="700" fill="#FF6FA5">*****</text><text x="948" y="570" text-anchor="middle" font-size="20" fill="#203044">空格不能随意删除</text></g>
  <g id="brush-rule" data-pptx-bounds="300 634 680 40"><text x="640" y="664" text-anchor="middle" font-size="24" font-weight="700" fill="#203044">一条 cout 画一行，多条就画出形状。</text></g>
