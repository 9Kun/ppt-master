  <g id="exercise-three" data-pptx-bounds="862 228 342 360"><circle cx="1033" cy="284" r="50" fill="#FF6FA5"/><text x="1033" y="298" text-anchor="middle" font-size="32" font-weight="700" fill="#FFFFFF">3</text><rect x="862" y="320" width="342" height="268" rx="38" fill="#FFE2ED"/><text x="1033" y="382" text-anchor="middle" font-size="24" font-weight="700" fill="#203044">连续输出三项</text><text x="1033" y="430" text-anchor="middle" font-family="Consolas, Courier New, monospace" font-size="22" fill="#203044">1 + 2</text><text x="1033" y="474" text-anchor="middle" font-family="Consolas, Courier New, monospace" font-size="22" fill="#203044">3 * 4</text><text x="1033" y="518" text-anchor="middle" font-family="Consolas, Courier New, monospace" font-size="22" fill="#203044">2 * 2</text><text x="1033" y="560" text-anchor="middle" font-size="18" fill="#FF6FA5">暂不揭晓结果</text></g>
