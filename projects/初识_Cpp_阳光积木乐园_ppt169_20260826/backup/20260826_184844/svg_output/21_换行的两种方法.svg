<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" data-pptx-page-role="content" font-family="Microsoft YaHei, Arial, sans-serif">
  <rect id="background" data-pptx-role="background" width="1280" height="720" fill="#FFFDF5"/>
  <g id="header" data-pptx-bounds="52 34 840 82"><text x="52" y="82" font-family="YouYuan, Microsoft YaHei, sans-serif" font-size="44" font-weight="700" fill="#203044">让光标走到下一行</text></g>
  <g id="newline-route" data-pptx-bounds="52 144 736 212"><rect x="52" y="144" width="736" height="212" rx="38" fill="#EAF5FF"/><rect x="84" y="174" width="150" height="56" rx="24" fill="#2E9BFF"/><text x="159" y="212" text-anchor="middle" font-family="Consolas, Courier New, monospace" font-size="24" font-weight="700" fill="#FFFFFF">方法 1</text><text x="84" y="282" font-family="Consolas, Courier New, monospace" font-size="26" font-weight="700" fill="#203044">cout &lt;&lt; "A\nB";</text><text x="500" y="282" font-size="22" fill="#2E9BFF">\n 写在字符串里</text></g>
  <g id="endl-route" data-pptx-bounds="52 386 736 212"><rect x="52" y="386" width="736" height="212" rx="38" fill="#FFF0D6"/><rect x="84" y="416" width="150" height="56" rx="24" fill="#FF9F1C"/><text x="159" y="454" text-anchor="middle" font-family="Consolas, Courier New, monospace" font-size="24" font-weight="700" fill="#FFFFFF">方法 2</text><text x="84" y="524" font-family="Consolas, Courier New, monospace" font-size="22" font-weight="700" fill="#203044">cout &lt;&lt; "A" &lt;&lt; endl &lt;&lt; "B";</text><text x="500" y="568" font-size="22" fill="#FF9F1C">endl 没有引号</text></g>
  <g id="shared-terminal" data-pptx-bounds="832 144 396 454"><rect x="832" y="144" width="396" height="454" rx="38" fill="#17243A"/><text x="1030" y="208" text-anchor="middle" font-size="22" font-weight="700" fill="#EAF5FF">两种写法，相同结果</text><text x="930" y="328" font-family="Consolas, Courier New, monospace" font-size="44" font-weight="700" fill="#FFFFFF">A</text><text x="930" y="402" font-family="Consolas, Courier New, monospace" font-size="44" font-weight="700" fill="#FFFFFF">B</text><rect x="916" y="430" width="28" height="8" rx="4" fill="#22C55E"/><text x="1030" y="526" text-anchor="middle" font-size="22" fill="#EAF5FF">光标已经来到下一行</text></g>
  <g id="rule" data-pptx-bounds="278 632 724 40"><text x="640" y="662" text-anchor="middle" font-size="22" font-weight="700" fill="#203044">会用一种就能换行；认识两种更方便读代码。</text></g>
