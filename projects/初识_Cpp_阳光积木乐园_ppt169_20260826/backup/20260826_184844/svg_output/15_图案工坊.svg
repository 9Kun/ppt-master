  <g id="pattern-menu" data-pptx-bounds="52 142 286 514"><rect x="52" y="142" width="286" height="514" rx="38" fill="#EAF5FF"/><text x="84" y="190" font-size="24" font-weight="700" fill="#2E9BFF">选择图案</text><rect x="76" y="220" width="238" height="70" rx="24" fill="#FFFFFF"/><text x="195" y="264" text-anchor="middle" font-size="22" fill="#203044">五星连珠</text><rect x="76" y="308" width="238" height="70" rx="24" fill="#2E9BFF"/><text x="195" y="352" text-anchor="middle" font-size="22" font-weight="700" fill="#FFFFFF">智慧树</text><rect x="76" y="396" width="238" height="70" rx="24" fill="#FFFFFF"/><text x="195" y="440" text-anchor="middle" font-size="22" fill="#203044">温暖爱心</text><rect x="76" y="484" width="238" height="70" rx="24" fill="#FFFFFF"/><text x="195" y="528" text-anchor="middle" font-size="22" fill="#203044">小房子</text><text x="84" y="610" font-size="18" fill="#FF9F1C">空格也是图案的一部分</text></g>
  <g id="pattern-code" data-pptx-bounds="370 142 506 514"><rect x="370" y="142" width="506" height="514" rx="38" fill="#FFFFFF" stroke="#CFE5F8" stroke-width="2"/><circle cx="404" cy="176" r="8" fill="#FF6FA5"/><circle cx="430" cy="176" r="8" fill="#FF9F1C"/><circle cx="456" cy="176" r="8" fill="#22C55E"/><text x="406" y="252" font-family="Consolas, Courier New, monospace" font-size="22" fill="#2E9BFF">cout &lt;&lt; "  *  " &lt;&lt; endl;</text><text x="406" y="322" font-family="Consolas, Courier New, monospace" font-size="22" fill="#FF9F1C">cout &lt;&lt; " *** " &lt;&lt; endl;</text><text x="406" y="392" font-family="Consolas, Courier New, monospace" font-size="22" fill="#FF6FA5">cout &lt;&lt; "*****" &lt;&lt; endl;</text><rect x="406" y="470" width="432" height="124" rx="28" fill="#EAF5FF"/><text x="622" y="520" text-anchor="middle" font-size="22" font-weight="700" fill="#203044">每条 cout 画一行</text><text x="622" y="558" text-anchor="middle" font-size="20" fill="#2E9BFF">多行组合，图案就出现了</text></g>
