<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" data-pptx-page-role="content" font-family="Microsoft YaHei, Arial, sans-serif">
  <rect id="background" data-pptx-role="background" width="1280" height="720" fill="#FFFDF5"/>
  <g id="header" data-pptx-bounds="50 34 1040 84"><use data-icon="tabler-filled/alert-triangle" x="50" y="36" width="52" height="52" fill="#FF6FA5"/><text x="122" y="82" font-family="YouYuan, Microsoft YaHei, sans-serif" font-size="44" font-weight="700" fill="#203044">常见编程错误 · 配对与拼写</text></g>
  <g id="pair-maze" data-pptx-bounds="50 144 570 480"><rect x="50" y="144" width="570" height="480" rx="40" fill="#EAF5FF"/><text x="86" y="198" font-size="28" font-weight="700" fill="#2E9BFF">先检查成对符号</text><rect x="86" y="234" width="498" height="104" rx="28" fill="#FFFFFF"/><text x="335" y="300" text-anchor="middle" font-family="Consolas, Courier New, monospace" font-size="34" font-weight="700" fill="#203044">(　)　{　}　"　"</text><text x="86" y="392" font-size="22" fill="#203044">字符串里要显示双引号：</text><rect x="86" y="420" width="498" height="102" rx="26" fill="#17243A"/><text x="335" y="480" text-anchor="middle" font-family="Consolas, Courier New, monospace" font-size="20" font-weight="700" fill="#FFFFFF">cout &lt;&lt; "He said \"Hello\"";</text><text x="86" y="576" font-size="20" fill="#2E9BFF">配对完整，路径才会闭合。</text></g>
  <g id="spelling-fixes" data-pptx-bounds="662 144 568 480"><rect x="662" y="144" width="568" height="480" rx="40" fill="#FFF0D6"/><text x="698" y="198" font-size="28" font-weight="700" fill="#FF9F1C">再检查关键单词</text><rect x="698" y="238" width="220" height="90" rx="24" fill="#FFFFFF"/><text x="808" y="276" text-anchor="middle" font-family="Consolas, Courier New, monospace" font-size="20" fill="#FF6FA5">mian</text><text x="808" y="308" text-anchor="middle" font-family="Consolas, Courier New, monospace" font-size="22" font-weight="700" fill="#22C55E">main</text><rect x="970" y="238" width="220" height="90" rx="24" fill="#FFFFFF"/><text x="1080" y="276" text-anchor="middle" font-family="Consolas, Courier New, monospace" font-size="20" fill="#FF6FA5">i0stream</text><text x="1080" y="308" text-anchor="middle" font-family="Consolas, Courier New, monospace" font-size="22" font-weight="700" fill="#22C55E">iostream</text><rect x="698" y="360" width="220" height="90" rx="24" fill="#FFFFFF"/><text x="808" y="398" text-anchor="middle" font-family="Consolas, Courier New, monospace" font-size="20" fill="#FF6FA5">print</text><text x="808" y="430" text-anchor="middle" font-family="Consolas, Courier New, monospace" font-size="22" font-weight="700" fill="#22C55E">printf</text><rect x="970" y="360" width="220" height="90" rx="24" fill="#FFFFFF"/><text x="1080" y="398" text-anchor="middle" font-family="Consolas, Courier New, monospace" font-size="20" fill="#FF6FA5">end1</text><text x="1080" y="430" text-anchor="middle" font-family="Consolas, Courier New, monospace" font-size="22" font-weight="700" fill="#22C55E">endl</text><text x="698" y="526" font-size="22" font-weight="700" fill="#203044">一个字符错，程序也会停下来。</text><text x="698" y="570" font-size="20" fill="#FF9F1C">慢一点检查，反而更快通过。</text></g>
