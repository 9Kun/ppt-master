<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" data-pptx-page-role="content" font-family="Microsoft YaHei, Arial, sans-serif">
  <rect id="background" data-pptx-role="background" width="1280" height="720" fill="#FFFDF5"/>
  <g id="header" data-pptx-bounds="50 34 1160 82"><text x="50" y="82" font-family="YouYuan, Microsoft YaHei, sans-serif" font-size="44" font-weight="700" fill="#203044">五块积木，搭成一个程序</text><rect x="980" y="42" width="240" height="52" rx="26" fill="#FFE2ED"/><text x="1100" y="77" text-anchor="middle" font-size="18" font-weight="700" fill="#FF6FA5">比喻帮助记忆</text></g>
  <g id="code-core" data-pptx-bounds="350 142 580 468"><rect x="350" y="142" width="580" height="468" rx="36" fill="#FFFFFF" stroke="#CFE5F8" stroke-width="3"/><circle cx="382" cy="174" r="8" fill="#FF6FA5"/><circle cx="408" cy="174" r="8" fill="#FF9F1C"/><circle cx="434" cy="174" r="8" fill="#22C55E"/><text x="390" y="246" font-family="Consolas, Courier New, monospace" font-size="22" fill="#2E9BFF">#include &lt;iostream&gt;</text><text x="390" y="306" font-family="Consolas, Courier New, monospace" font-size="22" fill="#FF9F1C">using namespace std;</text><text x="390" y="366" font-family="Consolas, Courier New, monospace" font-size="22" fill="#203044">int main() {</text><text x="422" y="426" font-family="Consolas, Courier New, monospace" font-size="22" font-weight="700" fill="#FF6FA5">cout &lt;&lt; "Hello";</text><text x="422" y="486" font-family="Consolas, Courier New, monospace" font-size="22" fill="#22C55E">return 0;</text><text x="390" y="546" font-family="Consolas, Courier New, monospace" font-size="22" fill="#203044">}</text></g>
  <g id="toolbox" data-pptx-bounds="50 142 250 104"><rect x="50" y="142" width="250" height="104" rx="28" fill="#2E9BFF"/><text x="74" y="182" font-size="24" font-weight="700" fill="#FFFFFF">工具箱</text><text x="74" y="218" font-size="18" fill="#FFFFFF">引入输入输出工具</text></g>
  <g id="warehouse" data-pptx-bounds="50 274 250 104"><rect x="50" y="274" width="250" height="104" rx="28" fill="#FF9F1C"/><text x="74" y="314" font-size="24" font-weight="700" fill="#FFFFFF">标准仓库</text><text x="74" y="350" font-size="18" fill="#FFFFFF">直接使用标准库名字</text></g>
  <g id="front-door" data-pptx-bounds="50 406 250 104"><rect x="50" y="406" width="250" height="104" rx="28" fill="#FFFFFF" stroke="#CFE5F8" stroke-width="3"/><text x="74" y="446" font-size="24" font-weight="700" fill="#203044">正门 main</text><text x="74" y="482" font-size="18" fill="#203044">程序从这里开始</text></g>
  <g id="speaker" data-pptx-bounds="980 208 250 104"><rect x="980" y="208" width="250" height="104" rx="28" fill="#FF6FA5"/><text x="1004" y="248" font-size="24" font-weight="700" fill="#FFFFFF">广播喇叭</text><text x="1004" y="284" font-size="18" fill="#FFFFFF">cout 是标准输出对象</text></g>
  <g id="finish-stamp" data-pptx-bounds="980 388 250 104"><rect x="980" y="388" width="250" height="104" rx="28" fill="#22C55E"/><text x="1004" y="428" font-size="24" font-weight="700" fill="#FFFFFF">完成印章</text><text x="1004" y="464" font-size="18" fill="#FFFFFF">向环境报告正常结束</text></g>
  <g id="boundary-note" data-pptx-bounds="350 636 580 42"><text x="640" y="666" text-anchor="middle" font-size="18" fill="#203044">比喻不是正式定义；小字才是技术作用。</text></g>
</svg>
