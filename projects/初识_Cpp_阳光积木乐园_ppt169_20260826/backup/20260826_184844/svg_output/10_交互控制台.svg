    <text x="552" y="170" text-anchor="middle" font-size="18" fill="#2E9BFF">《静夜思》</text>
    <rect x="644" y="116" width="160" height="62" rx="22" fill="#FFFFFF" stroke="#CFE5F8" stroke-width="2"/>
    <text x="724" y="156" text-anchor="middle" font-size="20" font-weight="700" fill="#203044">输出一个图案</text>
