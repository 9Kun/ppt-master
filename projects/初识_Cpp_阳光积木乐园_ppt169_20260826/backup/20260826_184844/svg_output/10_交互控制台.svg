    <rect x="300" y="250" width="516" height="332" rx="34" fill="#FFFFFF" stroke="#CFE5F8" stroke-width="2"/>
    <circle cx="332" cy="282" r="8" fill="#FF6FA5"/><circle cx="358" cy="282" r="8" fill="#FF9F1C"/><circle cx="384" cy="282" r="8" fill="#22C55E"/>
    <text x="332" y="340" font-family="Consolas, Courier New, monospace" font-size="18" fill="#2E9BFF">#include &lt;iostream&gt;</text>
    <text x="332" y="384" font-family="Consolas, Courier New, monospace" font-size="18" fill="#FF9F1C">using namespace std;</text>
    <text x="332" y="428" font-family="Consolas, Courier New, monospace" font-size="18" fill="#203044">int main() {</text>
    <rect x="320" y="446" width="462" height="52" rx="14" fill="#EAF5FF"/>
    <text x="344" y="480" font-family="Consolas, Courier New, monospace" font-size="22" font-weight="700" fill="#FF6FA5">cout &lt;&lt; "*****";</text>
    <text x="332" y="538" font-family="Consolas, Courier New, monospace" font-size="18" fill="#22C55E">return 0; }</text>
    <rect x="620" y="596" width="196" height="56" rx="20" fill="#FF9F1C"/>
    <text x="718" y="633" text-anchor="middle" font-size="22" font-weight="700" fill="#FFFFFF">▶ 运行代码</text>
