<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" data-pptx-page-role="content" font-family="Microsoft YaHei, Arial, sans-serif">
  <rect id="background" data-pptx-role="background" width="1280" height="720" fill="#FFFDF5"/>
  <g id="header" data-pptx-bounds="50 32 980 82"><text x="50" y="80" font-family="YouYuan, Microsoft YaHei, sans-serif" font-size="44" font-weight="700" fill="#203044">一张可复用的程序模板</text><text x="728" y="78" font-size="22" fill="#2E9BFF">固定框架，只替换 cout 内容</text></g>
  <g id="program-template" data-pptx-bounds="50 132 666 526"><rect x="50" y="132" width="666" height="526" rx="40" fill="#17243A"/><circle cx="86" cy="166" r="8" fill="#FF6FA5"/><circle cx="112" cy="166" r="8" fill="#FF9F1C"/><circle cx="138" cy="166" r="8" fill="#22C55E"/><text x="90" y="230" font-family="Consolas, Courier New, monospace" font-size="20" fill="#2E9BFF">#include &lt;iostream&gt;  // 输入输出工具</text><text x="90" y="292" font-family="Consolas, Courier New, monospace" font-size="20" fill="#FF9F1C">using namespace std;   // 标准库名字</text><text x="90" y="354" font-family="Consolas, Courier New, monospace" font-size="20" fill="#FFFFFF">int main() {           // 程序入口</text><text x="122" y="416" font-family="Consolas, Courier New, monospace" font-size="20" font-weight="700" fill="#FF6FA5">cout &lt;&lt; "内容";    // 替换这里</text><text x="122" y="478" font-family="Consolas, Courier New, monospace" font-size="20" fill="#22C55E">return 0;            // 正常结束</text><text x="90" y="540" font-family="Consolas, Courier New, monospace" font-size="20" fill="#FFFFFF">}</text><text x="90" y="614" font-size="18" fill="#EAF5FF">口述五块作用，再遮住模板默写。</text></g>
  <g id="cout-rules" data-pptx-bounds="758 132 472 526"><rect x="758" y="132" width="472" height="526" rx="40" fill="#EAF5FF"/><text x="794" y="188" font-size="28" font-weight="700" fill="#2E9BFF">cout 五条规则</text><rect x="794" y="222" width="400" height="62" rx="22" fill="#FFFFFF"/><text x="824" y="262" font-size="20" fill="#203044">1　单行输出</text><rect x="794" y="300" width="400" height="62" rx="22" fill="#FFFFFF"/><text x="824" y="340" font-size="20" fill="#203044">2　输出后用 endl 换行</text><rect x="794" y="378" width="400" height="62" rx="22" fill="#FFFFFF"/><text x="824" y="418" font-size="20" fill="#203044">3　多行就写多条 cout</text><rect x="794" y="456" width="400" height="62" rx="22" fill="#FFFFFF"/><text x="824" y="496" font-size="20" fill="#203044">4　文字放在双引号里</text><rect x="794" y="534" width="400" height="62" rx="22" fill="#FFFFFF"/><text x="824" y="574" font-size="20" fill="#203044">5　表达式不加引号会计算</text><text x="794" y="632" font-size="18" fill="#FF9F1C">家长：只提问，不直接报答案。</text></g>
</svg>
