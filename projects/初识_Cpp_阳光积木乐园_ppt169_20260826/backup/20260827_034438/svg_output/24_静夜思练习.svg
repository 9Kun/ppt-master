<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" data-pptx-page-role="content" font-family="Microsoft YaHei, Arial, sans-serif">
  <rect id="background" data-pptx-role="background" width="1280" height="720" fill="#FFFDF5"/>
  <g id="header" data-pptx-bounds="50 34 800 84"><rect x="50" y="34" width="232" height="56" rx="28" fill="#2E9BFF"/><text x="166" y="72" text-anchor="middle" font-size="22" font-weight="700" fill="#FFFFFF">C5001 · 静夜思</text><text x="310" y="78" font-family="YouYuan, Microsoft YaHei, sans-serif" font-size="44" font-weight="700" fill="#203044">一行诗，一条 cout</text></g>
  <g id="poem-card" data-pptx-bounds="50 146 400 506"><rect x="50" y="146" width="400" height="506" rx="40" fill="#EAF5FF"/><use data-icon="tabler-filled/book" x="86" y="184" width="46" height="46" fill="#2E9BFF"/><text x="250" y="228" text-anchor="middle" font-size="32" font-weight="700" fill="#203044">静夜思</text><text x="250" y="304" text-anchor="middle" font-size="24" fill="#203044">床前明月光，</text><text x="250" y="364" text-anchor="middle" font-size="24" fill="#203044">疑是地上霜。</text><text x="250" y="424" text-anchor="middle" font-size="24" fill="#203044">举头望明月，</text><text x="250" y="484" text-anchor="middle" font-size="24" fill="#203044">低头思故乡。</text><text x="250" y="574" text-anchor="middle" font-size="20" fill="#2E9BFF">标点和换行都要一致</text></g>
  <g id="poem-code" data-pptx-bounds="492 146 738 506"><rect x="492" y="146" width="738" height="506" rx="40" fill="#17243A"/><circle cx="528" cy="180" r="8" fill="#FF6FA5"/><circle cx="554" cy="180" r="8" fill="#FF9F1C"/><circle cx="580" cy="180" r="8" fill="#22C55E"/><text x="530" y="244" font-family="Consolas, Courier New, monospace" font-size="20" fill="#2E9BFF">cout &lt;&lt; "静夜思" &lt;&lt; endl;</text><text x="530" y="310" font-family="Consolas, Courier New, monospace" font-size="20" fill="#FFFFFF">cout &lt;&lt; "床前明月光，" &lt;&lt; endl;</text><text x="530" y="376" font-family="Consolas, Courier New, monospace" font-size="20" fill="#FFFFFF">cout &lt;&lt; "疑是地上霜。" &lt;&lt; endl;</text><text x="530" y="442" font-family="Consolas, Courier New, monospace" font-size="20" fill="#FFFFFF">cout &lt;&lt; "举头望明月，" &lt;&lt; endl;</text><text x="530" y="508" font-family="Consolas, Courier New, monospace" font-size="20" fill="#FFFFFF">cout &lt;&lt; "低头思故乡。" &lt;&lt; endl;</text><rect x="926" y="562" width="252" height="54" rx="20" fill="#22C55E"/><text x="1052" y="598" text-anchor="middle" font-size="20" font-weight="700" fill="#FFFFFF">五条语句，完整输出</text></g>
</svg>
