<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" data-pptx-page-role="content" font-family="Microsoft YaHei, Arial, sans-serif">
  <rect id="background" data-pptx-role="background" width="1280" height="720" fill="#FFFDF5"/>
  <g id="header" data-pptx-bounds="52 34 900 82"><text x="52" y="82" font-family="YouYuan, Microsoft YaHei, sans-serif" font-size="44" font-weight="700" fill="#203044">拆开 cout 语句看一看</text></g>
  <g id="code-strip" data-pptx-bounds="170 126 940 104"><rect x="170" y="126" width="940" height="104" rx="34" fill="#17243A"/><circle cx="208" cy="160" r="8" fill="#FF6FA5"/><circle cx="234" cy="160" r="8" fill="#FF9F1C"/><circle cx="260" cy="160" r="8" fill="#22C55E"/><text x="640" y="194" text-anchor="middle" font-family="Consolas, Courier New, monospace" font-size="38" font-weight="700" fill="#FFFFFF">cout &lt;&lt; "Hello World!";</text></g>
  <g id="token-connectors" data-pptx-bounds="218 224 884 60"><polyline points="424,224 424,252 232,252 232,278" fill="none" stroke="#2E9BFF" stroke-width="3"/><polygon points="232,278 225,266 239,266" fill="#2E9BFF"/><polyline points="520,224 520,254 610,254 610,278" fill="none" stroke="#FF9F1C" stroke-width="3"/><polygon points="610,278 603,266 617,266" fill="#FF9F1C"/><polyline points="720,224 720,254 694,254 694,278" fill="none" stroke="#FF9F1C" stroke-width="3"/><polygon points="694,278 687,266 701,266" fill="#FF9F1C"/><polyline points="890,224 890,252 1060,252 1060,278" fill="none" stroke="#FF6FA5" stroke-width="3"/><polygon points="1060,278 1053,266 1067,266" fill="#FF6FA5"/></g>
  <g id="pattern-menu" data-pptx-bounds="52 278 360 300"><rect x="52" y="278" width="360" height="300" rx="38" fill="#EAF5FF"/><rect x="88" y="314" width="284" height="74" rx="26" fill="#2E9BFF"/><text x="230" y="363" text-anchor="middle" font-family="Consolas, Courier New, monospace" font-size="34" font-weight="700" fill="#FFFFFF">cout</text><text x="88" y="440" font-size="24" font-weight="700" fill="#203044">Console Output 的缩写</text><text x="88" y="488" font-size="22" fill="#203044">像“小喇叭”一样，</text><text x="88" y="526" font-size="22" fill="#203044">命令电脑把内容说出来。</text></g>
  <g id="pattern-code" data-pptx-bounds="452 278 400 300"><rect x="452" y="278" width="400" height="300" rx="38" fill="#FFF0D6"/><rect x="490" y="314" width="324" height="74" rx="26" fill="#FF9F1C"/><text x="652" y="363" text-anchor="middle" font-family="Consolas, Courier New, monospace" font-size="34" font-weight="700" fill="#FFFFFF">&lt;&lt;  "文字"</text><text x="490" y="440" font-size="24" font-weight="700" fill="#203044">&lt;&lt; 把内容送给 cout</text><text x="490" y="488" font-size="22" fill="#203044">双引号把文字框起来，</text><text x="490" y="526" font-size="22" fill="#203044">里面写什么，就显示什么。</text></g>
  <g id="pattern-terminal" data-pptx-bounds="892 278 336 300"><rect x="892" y="278" width="336" height="300" rx="38" fill="#FFE2ED"/><rect x="930" y="314" width="260" height="74" rx="26" fill="#FF6FA5"/><text x="1060" y="363" text-anchor="middle" font-family="Consolas, Courier New, monospace" font-size="40" font-weight="700" fill="#FFFFFF">;</text><text x="930" y="440" font-size="24" font-weight="700" fill="#203044">分号是语句结束符</text><text x="930" y="488" font-size="22" fill="#203044">像一句话的句号，</text><text x="930" y="526" font-size="22" fill="#203044">每句代码都要收好尾。</text></g>
  <rect x="218" y="616" width="844" height="62" rx="24" fill="#EAF5FF"/><text x="640" y="657" text-anchor="middle" font-size="22" font-weight="700" fill="#2E9BFF">想一想：如果把 &lt;&lt; 写成 &gt;&gt;，电脑还能“说话”吗？</text>
</svg>
