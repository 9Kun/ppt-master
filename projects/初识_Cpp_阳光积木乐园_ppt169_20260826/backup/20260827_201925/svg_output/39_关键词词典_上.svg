<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" data-pptx-page-role="content" font-family="Microsoft YaHei, Arial, sans-serif">
  <rect id="background" data-pptx-role="background" width="1280" height="720" fill="#FFFDF5"/>
  <g id="header" data-pptx-bounds="50 32 1000 86"><text x="50" y="80" font-family="YouYuan, Microsoft YaHei, sans-serif" font-size="44" font-weight="700" fill="#203044">C++ 词汇积木 · 上</text><text x="562" y="78" font-size="22" fill="#2E9BFF">看懂词根，代码不再陌生</text></g>
  <g id="word-include" data-pptx-bounds="60 144 350 130"><rect x="60" y="144" width="350" height="130" rx="30" fill="#2E9BFF"/><text x="92" y="194" font-family="Consolas, Courier New, monospace" font-size="28" font-weight="700" fill="#FFFFFF">include</text><text x="92" y="232" font-size="20" fill="#FFFFFF">包含：把工具引进来</text></g>
  <g id="word-iostream" data-pptx-bounds="450 144 380 130"><rect x="450" y="144" width="350" height="130" rx="30" fill="#EAF5FF"/><text x="482" y="194" font-family="Consolas, Courier New, monospace" font-size="28" font-weight="700" fill="#2E9BFF">iostream</text><text x="482" y="232" font-size="20" fill="#203044">input/output stream：输入输出流</text></g>
  <g id="word-using" data-pptx-bounds="840 144 350 130"><rect x="840" y="144" width="350" height="130" rx="30" fill="#FF9F1C"/><text x="872" y="194" font-family="Consolas, Courier New, monospace" font-size="28" font-weight="700" fill="#FFFFFF">using</text><text x="872" y="232" font-size="20" fill="#FFFFFF">使用：开始采用某个名字</text></g>
  <g id="word-namespace" data-pptx-bounds="120 324 350 130"><rect x="120" y="324" width="350" height="130" rx="30" fill="#FFE2ED"/><text x="152" y="374" font-family="Consolas, Courier New, monospace" font-size="28" font-weight="700" fill="#FF6FA5">namespace</text><text x="152" y="412" font-size="20" fill="#203044">name + space：名字空间</text></g>
  <g id="word-std" data-pptx-bounds="510 324 350 130"><rect x="510" y="324" width="350" height="130" rx="30" fill="#E9FBEF"/><text x="542" y="374" font-family="Consolas, Courier New, monospace" font-size="28" font-weight="700" fill="#22C55E">std</text><text x="542" y="412" font-size="20" fill="#203044">standard：标准库简称</text></g>
  <g id="word-main" data-pptx-bounds="900 324 290 130"><rect x="900" y="324" width="290" height="130" rx="30" fill="#FFFFFF" stroke="#CFE5F8" stroke-width="3"/><text x="932" y="374" font-family="Consolas, Courier New, monospace" font-size="28" font-weight="700" fill="#203044">main</text><text x="932" y="412" font-size="20" fill="#203044">主要的：程序入口</text></g>
  <g id="code-order" data-pptx-bounds="180 526 920 112"><rect x="180" y="526" width="920" height="112" rx="32" fill="#17243A"/><text x="640" y="574" text-anchor="middle" font-size="20" fill="#EAF5FF">按代码出现顺序读一遍</text><text x="640" y="614" text-anchor="middle" font-family="Consolas, Courier New, monospace" font-size="22" font-weight="700" fill="#FFFFFF">include → iostream → using → namespace → std → main</text></g>
</svg>
