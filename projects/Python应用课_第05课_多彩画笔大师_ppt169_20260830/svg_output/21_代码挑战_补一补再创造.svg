7" fill="#FFFFFF">t.begin_fill(); t.circle(</text><rect x="344" y="490" width="214" height="32" rx="10" fill="#5B3D22"/><text x="451" y="514" text-anchor="middle" font-family="Consolas, Courier New, monospace" font-size="17" fill="#FFCC71">空位5：50/65/75</text><text x="568" y="514" font-family="Consolas, Courier New, monospace" font-size="17" fill="#FFFFFF">); t.end_fill()</text></g>
