  <g id="code-card" data-pptx-bounds="54 252 642 372"><rect x="60" y="258" width="630" height="356" rx="28" fill="#17243A"/><circle cx="88" cy="284" r="6" fill="#FF6FA5"/><circle cx="108" cy="284" r="6" fill="#FFCC71"/><circle cx="128" cy="284" r="6" fill="#22C55E"/><text x="86" y="326" font-family="Consolas, Courier New, monospace" font-size="20" fill="#FFFFFF">import turtle</text><text x="86" y="362" font-family="Consolas, Courier New, monospace" font-size="20" fill="#FFFFFF">screen = turtle.Screen()</text><text x="86" y="398" font-family="Consolas, Courier New, monospace" font-size="20" fill="#FFCC71">screen.bgcolor("lightyellow")</text><text x="86" y="434" font-family="Consolas, Courier New, monospace" font-size="20" fill="#FFFFFF">t = turtle.Turtle()</text><text x="86" y="470" font-family="Consolas, Courier New, monospace" font-size="20" fill="#79C7FF">t.pencolor("blue")</text><text x="86" y="506" font-family="Consolas, Courier New, monospace" font-size="20" fill="#79C7FF">t.width(6)</text><text x="86" y="542" font-family="Consolas, Courier New, monospace" font-size="20" fill="#FFFFFF">t.circle(70)</text><text x="86" y="578" font-family="Consolas, Courier New, monospace" font-size="20" fill="#FFFFFF">turtle.done()</text></g>
