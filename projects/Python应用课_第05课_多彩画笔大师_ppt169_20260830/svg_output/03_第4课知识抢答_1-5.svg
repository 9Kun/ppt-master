<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" data-pptx-page-role="content" font-family="Microsoft YaHei, Arial, sans-serif">
  <rect id="page-bg" data-pptx-role="background" x="0" y="0" width="1280" height="720" fill="#FFFDF5"/>
  <g id="header" data-pptx-bounds="48 36 1184 86"><text x="52" y="88" font-family="YouYuan, Microsoft YaHei, sans-serif" font-size="44" font-weight="700" fill="#203044">第4课知识抢答 · 1–5</text><rect x="1012" y="48" width="196" height="42" rx="21" fill="#EAF5FF"/><text x="1110" y="77" text-anchor="middle" font-size="18" font-weight="700" fill="#2E9BFF">点击一次 · 揭晓一题</text></g>
  <g id="question-1" data-pptx-bounds="54 128 1172 94"><rect x="58" y="132" width="1164" height="86" rx="22" fill="#FFFFFF" stroke="#CFE5F8" stroke-width="2"/><circle cx="102" cy="175" r="25" fill="#2E9BFF"/><text x="102" y="184" text-anchor="middle" font-size="22" font-weight="700" fill="#FFFFFF">1</text><text x="146" y="183" font-size="24" font-weight="700" fill="#203044">屏幕中心坐标是什么？</text><rect x="948" y="151" width="236" height="48" rx="24" fill="#F2F6FA"/><text x="1066" y="182" text-anchor="middle" font-size="20" fill="#7A8796">想一想，再点击</text></g>
  <g id="answer-1" data-pptx-bounds="560 142 630 66"><rect x="566" y="144" width="618" height="62" rx="20" fill="#E9FBEF"/><text x="590" y="171" font-size="20" font-weight="700" fill="#168A42">答案：(0,0)</text><text x="590" y="196" font-size="17" fill="#203044">为什么：中心点的 x 和 y 都是 0。</text></g>
  <g id="question-2" data-pptx-bounds="54 230 1172 94"><rect x="58" y="234" width="1164" height="86" rx="22" fill="#FFFFFF" stroke="#CFE5F8" stroke-width="2"/><circle cx="102" cy="277" r="25" fill="#FF9F1C"/><text x="102" y="286" text-anchor="middle" font-size="22" font-weight="700" fill="#FFFFFF">2</text><text x="146" y="285" font-size="24" font-weight="700" fill="#203044">x 是正数，海龟通常向哪边？</text><rect x="948" y="253" width="236" height="48" rx="24" fill="#F2F6FA"/><text x="1066" y="284" text-anchor="middle" font-size="20" fill="#7A8796">方向小侦探</text></g>
  <g id="answer-2" data-pptx-bounds="560 244 630 66"><rect x="566" y="246" width="618" height="62" rx="20" fill="#E9FBEF"/><text x="590" y="273" font-size="20" font-weight="700" fill="#168A42">答案：向右</text><text x="590" y="298" font-size="17" fill="#203044">为什么：x 轴从中心向右增大。</text></g>
  <g id="question-3" data-pptx-bounds="54 332 1172 94"><rect x="58" y="336" width="1164" height="86" rx="22" fill="#FFFFFF" stroke="#CFE5F8" stroke-width="2"/><circle cx="102" cy="379" r="25" fill="#FF6FA5"/><text x="102" y="388" text-anchor="middle" font-size="22" font-weight="700" fill="#FFFFFF">3</text><text x="146" y="387" font-size="24" font-weight="700" fill="#203044">y 是正数，海龟通常向哪边？</text><rect x="948" y="355" width="236" height="48" rx="24" fill="#F2F6FA"/><text x="1066" y="386" text-anchor="middle" font-size="20" fill="#7A8796">方向小侦探</text></g>
  <g id="answer-3" data-pptx-bounds="560 346 630 66"><rect x="566" y="348" width="618" height="62" rx="20" fill="#E9FBEF"/><text x="590" y="375" font-size="20" font-weight="700" fill="#168A42">答案：向上</text><text x="590" y="400" font-size="17" fill="#203044">为什么：y 轴从中心向上增大。</text></g>
  <g id="question-4" data-pptx-bounds="54 434 1172 94"><rect x="58" y="438" width="1164" height="86" rx="22" fill="#FFFFFF" stroke="#CFE5F8" stroke-width="2"/><circle cx="102" cy="481" r="25" fill="#22C55E"/><text x="102" y="490" text-anchor="middle" font-size="22" font-weight="700" fill="#FFFFFF">4</text><text x="146" y="489" font-size="24" font-weight="700" fill="#203044">goto 需要几个坐标数字？</text><rect x="948" y="457" width="236" height="48" rx="24" fill="#F2F6FA"/><text x="1066" y="488" text-anchor="middle" font-size="20" fill="#7A8796">先横后竖</text></g>
  <g id="answer-4" data-pptx-bounds="560 448 630 66"><rect x="566" y="450" width="618" height="62" rx="20" fill="#E9FBEF"/><text x="590" y="477" font-size="20" font-weight="700" fill="#168A42">答案：两个，x 和 y</text><text x="590" y="502" font-size="17" fill="#203044">为什么：先写横向位置，再写纵向位置。</text></g>
  <g id="question-5" data-pptx-bounds="54 536 1172 94"><rect x="58" y="540" width="1164" height="86" rx="22" fill="#FFFFFF" stroke="#CFE5F8" stroke-width="2"/><circle cx="102" cy="583" r="25" fill="#2E9BFF"/><text x="102" y="592" text-anchor="middle" font-size="22" font-weight="700" fill="#FFFFFF">5</text><text x="146" y="591" font-size="24" font-weight="700" fill="#203044">移动时不想留下线，要先做什么？</text><rect x="948" y="559" width="236" height="48" rx="24" fill="#F2F6FA"/><text x="1066" y="590" text-anchor="middle" font-size="20" fill="#7A8796">抬起画笔</text></g>
  <g id="answer-5" data-pptx-bounds="560 550 630 66"><rect x="566" y="552" width="618" height="62" rx="20" fill="#E9FBEF"/><text x="590" y="579" font-family="Consolas, Courier New, monospace" font-size="20" font-weight="700" fill="#168A42">答案：penup()</text><text x="590" y="604" font-size="17" fill="#203044">为什么：抬起画笔后移动不会留下轨迹。</text></g>
  <g id="footer" data-pptx-bounds="52 650 1160 30"><text x="54" y="676" font-size="14" fill="#617187">课前复习 · 坐标与移动</text><text x="1210" y="676" text-anchor="end" font-size="14" fill="#617187">03 / 23</text></g>
</svg>
