<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" data-pptx-page-role="content" font-family="Microsoft YaHei, Arial, sans-serif">
  <rect id="page-bg" data-pptx-role="background" x="0" y="0" width="1280" height="720" fill="#FFFDF5"/>
  <g id="header" data-pptx-bounds="48 30 1184 92"><text x="52" y="82" font-family="YouYuan, Microsoft YaHei, sans-serif" font-size="44" font-weight="700" fill="#203044">易错警示 · 海龟修理站</text><rect x="976" y="40" width="236" height="44" rx="22" fill="#FFE2ED"/><text x="1094" y="70" text-anchor="middle" font-size="18" font-weight="700" fill="#FF6FA5">看到现象，先自己排查</text></g>
  <g id="error-1-card" data-pptx-bounds="54 142 566 208"><rect x="60" y="148" width="554" height="196" rx="28" fill="#FFFFFF" stroke="#CFE5F8" stroke-width="2"/><use data-icon="tabler-filled/alert-triangle" x="84" y="172" width="34" height="34" fill="#FF6FA5"/><text x="134" y="197" font-size="22" font-weight="700" fill="#203044">颜色名称拼错</text><text x="84" y="246" font-size="19" fill="#617187">现象：程序报错或颜色没有出现。</text><rect x="84" y="276" width="500" height="48" rx="18" fill="#F2F6FA"/><text x="334" y="307" text-anchor="middle" font-size="18" fill="#7A8796">点击揭晓原因与修复</text></g>
  <g id="answer-1" data-pptx-bounds="80 226 508 102"><rect x="84" y="230" width="500" height="94" rx="20" fill="#FFE2ED"/><text x="104" y="260" font-size="17" font-weight="700" fill="#FF6FA5">原因：颜色单词拼写不正确。</text><text x="104" y="296" font-size="18" font-weight="700" fill="#168A42">修复：只从课堂颜色卡复制。</text></g>
  <g id="error-2-card" data-pptx-bounds="660 142 566 208"><rect x="666" y="148" width="554" height="196" rx="28" fill="#FFFFFF" stroke="#CFE5F8" stroke-width="2"/><use data-icon="tabler-filled/alert-triangle" x="690" y="172" width="34" height="34" fill="#FF6FA5"/><text x="740" y="197" font-size="22" font-weight="700" fill="#203044">begin / end 位置颠倒</text><text x="690" y="246" font-size="19" fill="#617187">现象：填充不出现，或代码顺序混乱。</text><rect x="690" y="276" width="500" height="48" rx="18" fill="#F2F6FA"/><text x="940" y="307" text-anchor="middle" font-size="18" fill="#7A8796">点击揭晓原因与修复</text></g>
  <g id="answer-2" data-pptx-bounds="686 226 508 102"><rect x="690" y="230" width="500" height="94" rx="20" fill="#FFE2ED"/><text x="710" y="260" font-size="17" font-weight="700" fill="#FF6FA5">原因：填充三明治顺序颠倒。</text><text x="710" y="296" font-size="18" font-weight="700" fill="#168A42">修复：开始—完整图形—结束。</text></g>
  <g id="error-3-card" data-pptx-bounds="54 370 566 208"><rect x="60" y="376" width="554" height="196" rx="28" fill="#FFFFFF" stroke="#CFE5F8" stroke-width="2"/><use data-icon="tabler-filled/alert-triangle" x="84" y="400" width="34" height="34" fill="#FF6FA5"/><text x="134" y="425" font-size="22" font-weight="700" fill="#203044">图形没有闭合</text><text x="84" y="474" font-size="19" fill="#617187">现象：填充区域缺一块或形状奇怪。</text><rect x="84" y="504" width="500" height="48" rx="18" fill="#F2F6FA"/><text x="334" y="535" text-anchor="middle" font-size="18" fill="#7A8796">点击揭晓原因与修复</text></g>
  <g id="answer-3" data-pptx-bounds="80 454 508 102"><rect x="84" y="458" width="500" height="94" rx="20" fill="#FFE2ED"/><text x="104" y="488" font-size="17" font-weight="700" fill="#FF6FA5">原因：边数或转角不对，没回到起点。</text><text x="104" y="524" font-size="18" font-weight="700" fill="#168A42">修复：检查循环次数和转角。</text></g>
  <g id="error-4-card" data-pptx-bounds="660 370 566 208"><rect x="666" y="376" width="554" height="196" rx="28" fill="#FFFFFF" stroke="#CFE5F8" stroke-width="2"/><use data-icon="tabler-filled/alert-triangle" x="690" y="400" width="34" height="34" fill="#FF6FA5"/><text x="740" y="425" font-size="22" font-weight="700" fill="#203044">内圈位置不理想</text><text x="690" y="474" font-size="19" fill="#617187">现象：内圈偏高、偏低或压住边框。</text><rect x="690" y="504" width="500" height="48" rx="18" fill="#F2F6FA"/><text x="940" y="535" text-anchor="middle" font-size="18" fill="#7A8796">点击揭晓原因与修复</text></g>
  <g id="answer-4" data-pptx-bounds="686 454 508 102"><rect x="690" y="458" width="500" height="94" rx="20" fill="#FFE2ED"/><text x="710" y="488" font-size="17" font-weight="700" fill="#FF6FA5">原因：goto 的 y 不适合当前半径。</text><text x="710" y="524" font-size="18" font-weight="700" fill="#168A42">修复：只改 y，一次只改一个参数。</text></g>
  <g id="repair-rhyme" data-pptx-bounds="132 606 1016 56"><rect x="136" y="608" width="1008" height="52" rx="26" fill="#E9FBEF"/><text x="640" y="642" text-anchor="middle" font-size="22" font-weight="700" fill="#168A42">拼写对、顺序对、图形闭合、一次只改一个参数</text></g>
  <g id="footer" data-pptx-bounds="52 676 1168 24"><text x="54" y="692" font-size="14" fill="#617187">调试习惯 · 从现象找到原因</text><text x="1218" y="692" text-anchor="end" font-size="14" fill="#617187">22 / 23</text></g>
