  <g id="header" data-pptx-bounds="52 40 1160 92"><text x="54" y="91" font-family="YouYuan, Microsoft YaHei, sans-serif" font-size="44" font-weight="700" fill="#203044">填充三明治</text><rect x="914" y="48" width="294" height="44" rx="22" fill="#FFE2ED"/><text x="1061" y="78" text-anchor="middle" font-size="18" font-weight="700" fill="#FF6FA5">顺序不能乱，图形要闭合</text></g>
  <g id="sandwich-stack" data-pptx-bounds="60 150 548 454">
    <rect x="70" y="158" width="528" height="430" rx="42" fill="#EAF5FF"/>
    <text x="334" y="202" text-anchor="middle" font-size="20" font-weight="700" fill="#2E9BFF">记忆比喻</text>
    <rect x="126" y="232" width="416" height="86" rx="30" fill="#FFCC71"/>
    <text x="334" y="284" text-anchor="middle" font-family="Consolas, Courier New, monospace" font-size="26" font-weight="700" fill="#203044">begin_fill()</text>
    <rect x="104" y="332" width="460" height="116" rx="30" fill="#FFB5CF"/>
    <text x="334" y="382" text-anchor="middle" font-size="26" font-weight="700" fill="#203044">完整封闭图形代码</text>
    <text x="334" y="418" text-anchor="middle" font-size="18" fill="#203044">画完所有边，并回到起点</text>
    <rect x="126" y="462" width="416" height="86" rx="30" fill="#FFCC71"/>
    <text x="334" y="514" text-anchor="middle" font-family="Consolas, Courier New, monospace" font-size="26" font-weight="700" fill="#203044">end_fill()</text>
  </g>
  <g id="technical-fact" data-pptx-bounds="646 150 566 258"><rect x="654" y="158" width="550" height="242" rx="32" fill="#FFFFFF" stroke="#CFE5F8" stroke-width="2"/><text x="684" y="204" font-size="20" font-weight="700" fill="#2E9BFF">准确的技术解释</text><text x="684" y="250" font-size="24" font-weight="700" fill="#203044">填充区域来自这两条命令之间</text><text x="684" y="286" font-size="24" font-weight="700" fill="#203044">绘制并闭合的路径。</text><rect x="684" y="322" width="476" height="52" rx="20" fill="#E9FBEF"/><text x="922" y="356" text-anchor="middle" font-size="20" font-weight="700" fill="#168A42">开始 → 完整图形 → 结束</text></g>
  <g id="code-example" data-pptx-bounds="646 424 566 202"><rect x="654" y="432" width="550" height="184" rx="28" fill="#17243A"/><circle cx="684" cy="458" r="6" fill="#FF6FA5"/><circle cx="704" cy="458" r="6" fill="#FFCC71"/><circle cx="724" cy="458" r="6" fill="#22C55E"/><text x="680" y="498" font-family="Consolas, Courier New, monospace" font-size="20" fill="#FFCC71">t.begin_fill()</text><text x="680" y="530" font-family="Consolas, Courier New, monospace" font-size="20" fill="#FFFFFF">for i in range(4):</text><text x="706" y="560" font-family="Consolas, Courier New, monospace" font-size="20" fill="#FFFFFF">t.forward(100); t.right(90)</text><text x="680" y="592" font-family="Consolas, Courier New, monospace" font-size="20" fill="#FFCC71">t.end_fill()</text></g>
  <g id="error-tip" data-pptx-bounds="90 610 1090 52"><rect x="94" y="612" width="1082" height="48" rx="24" fill="#FFE2ED"/><use data-icon="tabler-filled/alert-triangle" x="112" y="622" width="28" height="28" fill="#FF6FA5"/><text x="154" y="644" font-size="18" font-weight="700" fill="#203044">少了 end_fill()，或图形没有闭合，填充就可能不完整。</text></g>
