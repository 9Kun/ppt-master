      <text x="82" y="70" font-family="YouYuan, Microsoft YaHei, sans-serif" font-size="38" font-weight="700" fill="#203044">continue 放哪里，决定空白算不算一次</text>
      <text x="82" y="100" font-size="18" fill="#FF6FA5">先比较两种顺序，再揭晓</text>
    </g><g id="base-card" data-pptx-bounds="48 132 564 490"><rect x="48" y="132" width="564" height="490" rx="34" fill="#FFFFFF" stroke="#CFE5F8" stroke-width="2" /><text x="82" y="180" font-size="28" font-weight="700" fill="#203044">两种写法</text><circle cx="88" cy="219" r="7" fill="#FF6FA5" /><text x="112" y="226" font-size="23" fill="#203044">A：先判断空白 → continue → 再 tries + 1</text><circle cx="88" cy="273" r="7" fill="#FF6FA5" /><text x="112" y="280" font-size="23" fill="#203044">B：先 tries + 1 → 再判断空白 → continue</text><circle cx="88" cy="327" r="7" fill="#FF6FA5" /><text x="112" y="334" font-size="23" fill="#203044">目标：空白输入“不计次数”</text></g><g id="reveal-card" data-pptx-bounds="640 132 592 490" data-pptx-role="decoration"><rect x="640" y="132" width="592" height="490" rx="34" fill="#E9FBEF" stroke="#BDECCB" stroke-width="2" /><text x="676" y="180" font-size="28" font-weight="700" fill="#22C55E">正确顺序是 A</text><text x="680" y="228" font-size="22" fill="#203044">空白时应在计数之前 continue</text><text x="680" y="280" font-size="22" fill="#203044">这样 tries 不会增加</text><text x="680" y="332" font-size="22" fill="#203044">记忆：先过滤无效输入，再计数有效尝试</text></g><g id="footer-28" data-pptx-role="footer" data-pptx-bounds="48 674 1184 30"><text x="48" y="690" font-size="14" fill="#7A8A9B">小小特工任务中心</text><text x="1232" y="690" text-anchor="end" font-size="14" fill="#7A8A9B">28 / 32</text></g><g id="reveal-button" data-pptx-bounds="998 570 210 52" data-pptx-role="decoration"><rect x="998" y="570" width="210" height="52" rx="22" fill="#FF6FA5" /><text x="1103" y="604" text-anchor="middle" font-size="20" font-weight="700" fill="#FFFFFF">点击揭晓</text></g><g id="reveal-hit" data-pptx-bounds="998 570 210 52" data-pptx-role="decoration"><rect x="998" y="570" width="210" height="52" rx="22" fill="#FFFFFF" fill-opacity="0.001" /></g>
