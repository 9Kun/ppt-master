<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>第12课｜特工身份确认｜PPT 视觉预览</title>
<style>
  :root{--bg:#fffdf5;--ink:#203044;--blue:#2e9bff;--orange:#ff9f1c;--pink:#ff6fa5;--line:#dbe9f5;}
  *{box-sizing:border-box} body{margin:0;background:var(--bg);color:var(--ink);font-family:"Microsoft YaHei",Arial,sans-serif}
  header{position:sticky;top:0;z-index:5;display:flex;gap:16px;align-items:center;justify-content:space-between;padding:14px 22px;background:rgba(255,253,245,.96);border-bottom:1px solid var(--line);backdrop-filter:blur(10px)}
  h1{font-size:20px;margin:0}.meta{font-size:13px;opacity:.72}.controls{display:flex;gap:8px;align-items:center}
  button,select{border:1px solid var(--line);background:#fff;border-radius:999px;padding:9px 14px;color:var(--ink);font-weight:700;cursor:pointer}
  button:hover{border-color:var(--blue)}
  main{max-width:1440px;margin:0 auto;padding:20px;display:grid;grid-template-columns:230px minmax(0,1fr);gap:20px}
  aside{height:calc(100vh - 92px);overflow:auto;padding-right:4px}
  .thumb{width:100%;margin:0 0 10px;padding:8px;background:#fff;border:2px solid transparent;border-radius:16px;cursor:pointer;text-align:left}
  .thumb.active{border-color:var(--blue);box-shadow:0 6px 18px rgba(46,155,255,.14)}
  .thumb img{display:block;width:100%;aspect-ratio:16/9;object-fit:contain;border-radius:10px;background:#f7fbff}
  .thumb span{display:block;font-size:12px;margin-top:6px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .stage{min-width:0}.frame{background:#fff;border:1px solid var(--line);border-radius:24px;padding:12px;box-shadow:0 12px 40px rgba(32,48,68,.10)}
  #slide{display:block;width:100%;aspect-ratio:16/9;object-fit:contain;border-radius:16px;background:#fff}
  .caption{display:flex;justify-content:space-between;gap:16px;align-items:center;margin:14px 8px 0;font-weight:700}.hint{font-size:12px;font-weight:400;opacity:.62}
  @media(max-width:900px){main{grid-template-columns:1fr}aside{height:auto;display:flex;overflow-x:auto;gap:10px}.thumb{min-width:180px}.caption{align-items:flex-start;flex-direction:column}}
</style>
</head>
<body>
<header>
  <div><h1>第12课《特工身份确认》</h1><div class="meta">32 页 · svg_final 静态视觉预览 · 阳光积木乐园</div></div>
  <div class="controls"><button id="prev">← 上一页</button><select id="jump"></select><button id="next">下一页 →</button></div>
</header>
<main>
  <aside id="thumbs"></aside>
  <section class="stage"><div class="frame"><img id="slide" alt="slide preview" /></div><div class="caption"><span id="title"></span><span class="hint">← / → 键切页；本页只预览静态 SVG，PPTX 动画与 WPS 点击交互需在放映模式测试。</span></div></section>
</main>
<script>
const slides = [
'01_特工身份确认.svg','02_今天的任务路线.svg','03_复习抢答规则.svg','04_复习抢答_1_2.svg','05_复习抢答_3_4.svg','06_复习抢答_5_6.svg','07_复习抢答_7_8.svg','08_复习抢答_9_10.svg','09_任务启动.svg','10_新知精学.svg','11_while像值班守卫.svg','12_计数防止不停.svg','13_break提前下车.svg','14_continue跳过本轮.svg','15_for和while怎么选.svg','16_练习A_数到3停.svg','17_易错_漏掉计数增加.svg','18_本课选择题_1_2.svg','19_本课选择题_3_4.svg','20_本课选择题_5_6.svg','21_本课选择题_7_8.svg','22_break实战.svg','23_练习B_答对就break.svg','24_break执行路径.svg','25_微项目三次口令门.svg','26_三次口令门代码拆解.svg','27_三次口令门_运行验证.svg','28_continue位置很重要.svg','29_项目实施步骤.svg','30_作品验收与展示.svg','31_常见问题与处理.svg','32_离堂小结.svg'];
const src = n => encodeURI('../svg_final/' + n);
const thumbs=document.getElementById('thumbs'), jump=document.getElementById('jump'), hero=document.getElementById('slide'), title=document.getElementById('title');
let current=0;
slides.forEach((n,i)=>{const b=document.createElement('button');b.className='thumb';b.innerHTML=`<img loading="lazy" src="${src(n)}" alt=""><span>${n.replace('.svg','')}</span>`;b.onclick=()=>show(i);thumbs.appendChild(b);const o=document.createElement('option');o.value=i;o.textContent=n.replace('.svg','');jump.appendChild(o)});
function show(i){current=(i+slides.length)%slides.length;hero.src=src(slides[current]);title.textContent=slides[current].replace('.svg','');jump.value=current;[...thumbs.children].forEach((x,k)=>x.classList.toggle('active',k===current));thumbs.children[current].scrollIntoView({block:'nearest',inline:'nearest'});}
document.getElementById('prev').onclick=()=>show(current-1);document.getElementById('next').onclick=()=>show(current+1);jump.onchange=e=>show(+e.target.value);document.addEventListener('keydown',e=>{if(e.key==='ArrowLeft')show(current-1);if(e.key==='ArrowRight')show(current+1)});show(0);
</script>
</body>
</html>
