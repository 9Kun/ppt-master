<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" data-pptx-page-role="content" font-family="Microsoft YaHei, Arial, sans-serif"><rect id="background" data-pptx-role="background" width="1280" height="720" fill="#FFFDF5" /><g id="page-header" data-pptx-bounds="48 32 1184 78">
      <rect x="48" y="36" width="12" height="56" rx="6" fill="#2E9BFF" />
      <text x="82" y="70" font-family="YouYuan, Microsoft YaHei, sans-serif" font-size="38" font-weight="700" fill="#203044">完整代码：四块积木怎样配合？</text>
      <text x="82" y="100" font-size="18" fill="#2E9BFF">重点不是背代码，而是看清顺序</text>
    </g><g id="code-card" data-pptx-bounds="48 134 750 500"><rect x="48" y="134" width="750" height="500" rx="32" fill="#FFFFFF" stroke="#CFE5F8" stroke-width="2" /><circle cx="82" cy="168" r="8" fill="#FF6FA5" /><circle cx="108" cy="168" r="8" fill="#FF9F1C" /><circle cx="134" cy="168" r="8" fill="#22C55E" /><text x="172" y="176" font-size="19" font-weight="700" fill="#203044">Python 编辑器</text><text x="82" y="218" font-family="Consolas, Courier New, monospace" font-size="17" fill="#203044">secret = "python"</text><text x="82" y="239" font-family="Consolas, Courier New, monospace" font-size="17" fill="#203044">tries = 0</text><text x="82" y="260" font-family="Consolas, Courier New, monospace" font-size="17" fill="#203044"> </text><text x="82" y="281" font-family="Consolas, Courier New, monospace" font-size="17" fill="#2E9BFF">while tries &lt; 3:</text><text x="82" y="302" font-family="Consolas, Courier New, monospace" font-size="17" fill="#203044">    password = input("请输入特工口令：")</text><text x="82" y="323" font-family="Consolas, Courier New, monospace" font-size="17" fill="#203044"> </text><text x="82" y="344" font-family="Consolas, Courier New, monospace" font-size="17" fill="#2E9BFF">    if password == "":</text><text x="82" y="365" font-family="Consolas, Courier New, monospace" font-size="17" fill="#203044">        print("不能输入空白！")</text><text x="82" y="386" font-family="Consolas, Courier New, monospace" font-size="17" fill="#FF9F1C">        continue</text><text x="82" y="407" font-family="Consolas, Courier New, monospace" font-size="17" fill="#203044"> </text><text x="82" y="428" font-family="Consolas, Courier New, monospace" font-size="17" fill="#203044">    tries = tries + 1</text><text x="82" y="449" font-family="Consolas, Courier New, monospace" font-size="17" fill="#203044"> </text><text x="82" y="470" font-family="Consolas, Courier New, monospace" font-size="17" fill="#2E9BFF">    if password == secret:</text><text x="82" y="491" font-family="Consolas, Courier New, monospace" font-size="17" fill="#203044">        print("身份确认成功，欢迎特工！")</text><text x="82" y="512" font-family="Consolas, Courier New, monospace" font-size="17" fill="#FF9F1C">        break</text><text x="82" y="533" font-family="Consolas, Courier New, monospace" font-size="17" fill="#2E9BFF">    else:</text><text x="82" y="554" font-family="Consolas, Courier New, monospace" font-size="17" fill="#203044">        print("口令错误。还可尝试", 3 - tries, "次。")</text><text x="82" y="575" font-family="Consolas, Courier New, monospace" font-size="17" fill="#203044"> </text><text x="82" y="596" font-family="Consolas, Courier New, monospace" font-size="17" fill="#2E9BFF">if password != secret:</text><text x="82" y="617" font-family="Consolas, Courier New, monospace" font-size="17" fill="#203044">    print("三次机会已用完，任务暂停。")</text></g><g id="anatomy-1" data-pptx-bounds="832 156 368 82"><rect x="832" y="156" width="368" height="82" rx="24" fill="#FFFFFF" stroke="#2E9BFF" stroke-width="2" /><text x="860" y="188" font-size="21" font-weight="700" fill="#2E9BFF">① 条件</text><text x="860" y="218" font-family="Consolas, Microsoft YaHei, monospace" font-size="18" fill="#203044">tries &lt; 3</text></g><g id="anatomy-2" data-pptx-bounds="832 260 368 82"><rect x="832" y="260" width="368" height="82" rx="24" fill="#FFFFFF" stroke="#FF6FA5" stroke-width="2" /><text x="860" y="292" font-size="21" font-weight="700" fill="#FF6FA5">② 空白</text><text x="860" y="322" font-family="Consolas, Microsoft YaHei, monospace" font-size="18" fill="#203044">continue</text></g><g id="anatomy-3" data-pptx-bounds="832 364 368 82"><rect x="832" y="364" width="368" height="82" rx="24" fill="#FFFFFF" stroke="#FF9F1C" stroke-width="2" /><text x="860" y="396" font-size="21" font-weight="700" fill="#FF9F1C">③ 计数</text><text x="860" y="426" font-family="Consolas, Microsoft YaHei, monospace" font-size="18" fill="#203044">tries + 1</text></g><g id="anatomy-4" data-pptx-bounds="832 468 368 82"><rect x="832" y="468" width="368" height="82" rx="24" fill="#FFFFFF" stroke="#22C55E" stroke-width="2" /><text x="860" y="500" font-size="21" font-weight="700" fill="#22C55E">④ 成功</text><text x="860" y="530" font-family="Consolas, Microsoft YaHei, monospace" font-size="18" fill="#203044">break</text></g><g id="footer-26" data-pptx-role="footer" data-pptx-bounds="48 674 1184 30"><text x="48" y="690" font-size="14" fill="#7A8A9B">小小特工任务中心</text><text x="1232" y="690" text-anchor="end" font-size="14" fill="#7A8A9B">26 / 32</text></g></svg>