    <g id="full-code" data-pptx-bounds="64 234 644 330" font-family="Consolas, Courier New, monospace" font-size="16">
      <text x="64" y="258" fill="#2E9BFF">import turtle</text>
      <text x="64" y="284" fill="#33415C">screen=turtle.Screen()</text>
      <text x="64" y="310" fill="#33415C">screen.title("小红花画展"); screen.bgcolor("lightblue")</text>
      <text x="64" y="336" fill="#33415C">t=turtle.Turtle(); t.speed(0)</text>
      <text x="64" y="362" fill="#FF6FA5">t.color("red","pink")</text>
      <text x="64" y="388" fill="#33415C">for petal in range(6):</text>
      <text x="88" y="414" fill="#33415C">t.begin_fill(); t.circle(45); t.end_fill(); t.left(60)</text>
      <text x="64" y="440" fill="#33415C">t.dot(45,"yellow"); t.setheading(270)</text>
      <text x="64" y="466" fill="#33415C">t.pensize(8); t.pencolor("green"); t.forward(140)</text>
      <text x="64" y="492" fill="#33415C">t.hideturtle(); turtle.done()</text>
    </g>
