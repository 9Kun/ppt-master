<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" data-pptx-page-role="content" font-family="Microsoft YaHei, Arial, sans-serif"><rect x="0" y="0" width="1280" height="720" rx="0" fill="#FFFDF5" id="page-bg"/><circle cx="1210" cy="35" r="66" fill="#EAF5FF" opacity="0.9"/><circle cx="1250" cy="95" r="26" fill="#FFE2ED" opacity="0.9"/><rect x="34" y="28" width="16" height="54" rx="8" fill="#FF9F1C"/><text x="64" y="70" font-family="YouYuan, Microsoft YaHei, sans-serif" font-size="40" font-weight="700" fill="#203044" text-anchor="start">长代码，也是一块块拼起来的</text><text x="66" y="100" font-family="Microsoft YaHei, Arial, sans-serif" font-size="17" font-weight="400" fill="#60758A" text-anchor="start">出错时不要从头删：回到对应区块逐段检查</text><rect x="1000" y="34" width="210" height="42" rx="21" fill="#EAF5FF"/><text x="1105.0" y="62" font-family="Microsoft YaHei, Arial, sans-serif" font-size="16" font-weight="700" fill="#2E9BFF" text-anchor="middle">微项目装配</text><rect x="48" y="655" width="128" height="42" rx="21" fill="#FFF2DC"/><text x="112.0" y="683" font-family="Microsoft YaHei, Arial, sans-serif" font-size="15" font-weight="700" fill="#FF9F1C" text-anchor="middle">P31</text><rect x="48" y="160" width="360" height="190" rx="26" fill="#EAF5FF" stroke="#2E9BFF" stroke-width="2"/><text x="72" y="198" font-family="Microsoft YaHei, Arial, sans-serif" font-size="21" font-weight="700" fill="#2E9BFF" text-anchor="start">① 窗口设置</text><text x="72" y="236" font-family="Consolas, Courier New, monospace" font-size="16" font-weight="400" fill="#203044" text-anchor="start">screen = turtle.Screen()</text><text x="72" y="263" font-family="Consolas, Courier New, monospace" font-size="16" font-weight="400" fill="#203044" text-anchor="start">screen.title(&quot;小红花画展&quot;)</text><text x="72" y="290" font-family="Consolas, Courier New, monospace" font-size="16" font-weight="400" fill="#203044" text-anchor="start">screen.bgcolor(&quot;lightblue&quot;)</text><rect x="430" y="160" width="360" height="190" rx="26" fill="#FFF2DC" stroke="#FF9F1C" stroke-width="2"/><text x="454" y="198" font-family="Microsoft YaHei, Arial, sans-serif" font-size="21" font-weight="700" fill="#FF9F1C" text-anchor="start">② 创建海龟</text><text x="454" y="236" font-family="Consolas, Courier New, monospace" font-size="16" font-weight="400" fill="#203044" text-anchor="start">t = turtle.Turtle()</text><text x="454" y="263" font-family="Consolas, Courier New, monospace" font-size="16" font-weight="400" fill="#203044" text-anchor="start">t.speed(0)</text><rect x="812" y="160" width="420" height="190" rx="26" fill="#FFE2ED" stroke="#FF6FA5" stroke-width="2"/><text x="836" y="198" font-family="Microsoft YaHei, Arial, sans-serif" font-size="21" font-weight="700" fill="#FF6FA5" text-anchor="start">③ 花瓣循环</text><text x="836" y="236" font-family="Consolas, Courier New, monospace" font-size="16" font-weight="400" fill="#203044" text-anchor="start">t.color(&quot;red&quot;,&quot;pink&quot;)</text><text x="836" y="263" font-family="Consolas, Courier New, monospace" font-size="16" font-weight="400" fill="#203044" text-anchor="start">for petal in range(6):</text><text x="836" y="290" font-family="Consolas, Courier New, monospace" font-size="16" font-weight="400" fill="#203044" text-anchor="start">    ... circle(45) ...</text><text x="836" y="317" font-family="Consolas, Courier New, monospace" font-size="16" font-weight="400" fill="#203044" text-anchor="start">    t.left(60)</text><rect x="48" y="378" width="560" height="190" rx="26" fill="#E9FBEF" stroke="#22C55E" stroke-width="2"/><text x="72" y="416" font-family="Microsoft YaHei, Arial, sans-serif" font-size="21" font-weight="700" fill="#22C55E" text-anchor="start">④ 花心 + 花茎</text><text x="72" y="454" font-family="Consolas, Courier New, monospace" font-size="16" font-weight="400" fill="#203044" text-anchor="start">t.dot(45,&quot;yellow&quot;)</text><text x="72" y="481" font-family="Consolas, Courier New, monospace" font-size="16" font-weight="400" fill="#203044" text-anchor="start">t.setheading(270)</text><text x="72" y="508" font-family="Consolas, Courier New, monospace" font-size="16" font-weight="400" fill="#203044" text-anchor="start">t.forward(140)</text><rect x="630" y="378" width="602" height="190" rx="26" fill="#EAF5FF" stroke="#2E9BFF" stroke-width="2"/><text x="654" y="416" font-family="Microsoft YaHei, Arial, sans-serif" font-size="21" font-weight="700" fill="#2E9BFF" text-anchor="start">⑤ 收尾</text><text x="654" y="454" font-family="Consolas, Courier New, monospace" font-size="16" font-weight="400" fill="#203044" text-anchor="start">t.hideturtle()</text><text x="654" y="481" font-family="Consolas, Courier New, monospace" font-size="16" font-weight="400" fill="#203044" text-anchor="start">turtle.done()</text><text x="1220" y="684" font-family="Microsoft YaHei, Arial, sans-serif" font-size="14" font-weight="400" fill="#60758A" text-anchor="end">阳光积木实验室 · 一次只做清楚一件事</text></svg>
