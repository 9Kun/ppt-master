<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" data-pptx-page-role="content" font-family="Microsoft YaHei, Arial, sans-serif"><rect x="0" y="0" width="1280" height="720" fill="#FFFDF5" id="page-bg" /><circle cx="1210" cy="35" r="66" fill="#EAF5FF" opacity="0.9" /><circle cx="1250" cy="95" r="26" fill="#FFE2ED" opacity="0.9" /><rect x="34" y="28" width="16" height="54" rx="8" fill="#FF9F1C" /><text x="64" y="70" font-family="YouYuan, Microsoft YaHei, sans-serif" font-size="40" font-weight="700" fill="#203044">卡住时，先查这三处</text><text x="66" y="100" font-size="17" fill="#60758A">先定位现象，再查一个关键点；不要删掉全部重来</text><rect x="1000" y="34" width="210" height="42" rx="21" fill="#EAF5FF" /><text x="1105" y="62" font-size="16" font-weight="700" fill="#2E9BFF" text-anchor="middle">海龟修理站</text><rect x="48" y="655" width="128" height="42" rx="21" fill="#FFF2DC" /><text x="112" y="683" font-size="15" font-weight="700" fill="#FF9F1C" text-anchor="middle">P35</text><rect x="48" y="146" width="370" height="458" rx="30" fill="#FFFFFF" stroke="#CFE5F8" stroke-width="2" /><rect x="72" y="170" width="120" height="42" rx="21" fill="#EAF5FF" /><text x="132" y="198" font-size="16" font-weight="700" fill="#2E9BFF" text-anchor="middle">问题 1</text><text x="76" y="258" font-size="24" font-weight="700" fill="#203044">花瓣重复填充很慢</text><rect x="76" y="292" width="314" height="92" rx="18" fill="#F4FAFF" /><text x="94" y="320" font-size="14" font-weight="700" fill="#2E9BFF">先查</text><text x="94" y="347" font-size="16" fill="#203044">有没有设置绘图速度？</text><text x="94" y="372" font-family="Consolas, Courier New, monospace" font-size="17" font-weight="700" fill="#60758A">t.speed(...)</text><rect x="76" y="406" width="150" height="42" rx="21" fill="#FFF2DC" /><text x="151" y="434" font-size="16" font-weight="700" fill="#FF9F1C" text-anchor="middle">点击看修复</text><g id="reveal-fix1-hit" data-pptx-role="decoration" data-pptx-bounds="0 0 1280 720"><rect x="76" y="406" width="150" height="42" rx="20" fill="#FFFFFF" opacity="0.001" /></g><g id="fix-1" data-pptx-role="decoration" data-pptx-bounds="0 0 1280 720"><rect x="76" y="466" width="314" height="108" rx="18" fill="#E9FBEF" stroke="#22C55E" stroke-width="2" /><text x="94" y="495" font-size="14" font-weight="700" fill="#22C55E">修复</text><text x="94" y="525" font-family="Consolas, Courier New, monospace" font-size="18" font-weight="700" fill="#203044">t.speed(0)</text><text x="94" y="552" font-size="14" fill="#60758A">把绘图速度调到最快，再运行一次。</text></g><rect x="442" y="146" width="370" height="458" rx="30" fill="#FFFFFF" stroke="#CFE5F8" stroke-width="2" /><rect x="466" y="170" width="120" height="42" rx="21" fill="#FFF2DC" /><text x="526" y="198" font-size="16" font-weight="700" fill="#FF9F1C" text-anchor="middle">问题 2</text><text x="470" y="258" font-size="24" font-weight="700" fill="#203044">花茎方向错误</text><rect x="470" y="292" width="314" height="92" rx="18" fill="#FFF7E8" /><text x="488" y="320" font-size="14" font-weight="700" fill="#FF9F1C">先查</text><text x="488" y="347" font-size="16" fill="#203044">setheading() 里写了多少度？</text><text x="488" y="372" font-family="Consolas, Courier New, monospace" font-size="17" font-weight="700" fill="#60758A">0° → 右　90° → 上</text><rect x="470" y="406" width="150" height="42" rx="21" fill="#FFF2DC" /><text x="545" y="434" font-size="16" font-weight="700" fill="#FF9F1C" text-anchor="middle">点击看修复</text><g id="reveal-fix2-hit" data-pptx-role="decoration" data-pptx-bounds="0 0 1280 720"><rect x="470" y="406" width="150" height="42" rx="20" fill="#FFFFFF" opacity="0.001" /></g><g id="fix-2" data-pptx-role="decoration" data-pptx-bounds="0 0 1280 720"><rect x="470" y="466" width="314" height="108" rx="18" fill="#E9FBEF" stroke="#22C55E" stroke-width="2" /><text x="488" y="495" font-size="14" font-weight="700" fill="#22C55E">修复</text><text x="488" y="525" font-family="Consolas, Courier New, monospace" font-size="18" font-weight="700" fill="#203044">t.setheading(270)</text><text x="488" y="552" font-size="14" fill="#60758A">270° 朝下，再 forward() 就会画出花茎。</text></g><rect x="836" y="146" width="370" height="458" rx="30" fill="#FFFFFF" stroke="#CFE5F8" stroke-width="2" /><rect x="860" y="170" width="120" height="42" rx="21" fill="#FFE2ED" /><text x="920" y="198" font-size="16" font-weight="700" fill="#FF6FA5" text-anchor="middle">问题 3</text><text x="864" y="258" font-size="24" font-weight="700" fill="#203044">作品代码较长</text><rect x="864" y="292" width="314" height="92" rx="18" fill="#FFF3F7" /><text x="882" y="320" font-size="14" font-weight="700" fill="#FF6FA5">先查</text><text x="882" y="347" font-size="16" fill="#203044">刚刚新增的是哪一段？</text><text x="882" y="372" font-size="15" font-weight="700" fill="#60758A">先找到“最后一次改动”</text><rect x="864" y="406" width="150" height="42" rx="21" fill="#FFF2DC" /><text x="939" y="434" font-size="16" font-weight="700" fill="#FF9F1C" text-anchor="middle">点击看修复</text><g id="reveal-fix3-hit" data-pptx-role="decoration" data-pptx-bounds="0 0 1280 720"><rect x="864" y="406" width="150" height="42" rx="20" fill="#FFFFFF" opacity="0.001" /></g><g id="fix-3" data-pptx-role="decoration" data-pptx-bounds="0 0 1280 720"><rect x="864" y="466" width="314" height="108" rx="18" fill="#E9FBEF" stroke="#22C55E" stroke-width="2" /><text x="882" y="495" font-size="14" font-weight="700" fill="#22C55E">修复</text><text x="882" y="524" font-size="16" font-weight="700" fill="#203044">回到能运行的半成品</text><text x="882" y="552" font-size="14" fill="#60758A">逐段加回代码，每加一段就运行一次。</text></g><text x="1220" y="684" font-size="14" fill="#60758A" text-anchor="end">阳光积木实验室 · 一次只做清楚一件事</text></svg>