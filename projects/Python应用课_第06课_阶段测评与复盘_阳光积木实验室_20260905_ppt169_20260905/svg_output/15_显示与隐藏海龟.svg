<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" data-pptx-page-role="content" font-family="Microsoft YaHei, Arial, sans-serif"><rect x="0" y="0" width="1280" height="720" rx="0" fill="#FFFDF5" id="page-bg" /><circle cx="1210" cy="35" r="66" fill="#EAF5FF" opacity="0.9" /><circle cx="1250" cy="95" r="26" fill="#FFE2ED" opacity="0.9" /><rect x="34" y="28" width="16" height="54" rx="8" fill="#FF9F1C" /><text x="64" y="70" font-family="YouYuan, Microsoft YaHei, sans-serif" font-size="40" font-weight="700" fill="#203044" text-anchor="start">小海龟：上场 / 退场</text><text x="66" y="100" font-family="Microsoft YaHei, Arial, sans-serif" font-size="17" font-weight="400" fill="#60758A" text-anchor="start">显示方便观察，完成后隐藏让作品更整洁</text><rect x="1000" y="34" width="210" height="42" rx="21" fill="#EAF5FF" /><text x="1105" y="62" font-family="Microsoft YaHei, Arial, sans-serif" font-size="16" font-weight="700" fill="#2E9BFF" text-anchor="middle">新命令实验</text><rect x="48" y="655" width="128" height="42" rx="21" fill="#FFF2DC" /><text x="112" y="683" font-family="Microsoft YaHei, Arial, sans-serif" font-size="15" font-weight="700" fill="#FF9F1C" text-anchor="middle">P15</text><rect x="48" y="160" width="560" height="400" rx="30" fill="#EAF5FF" stroke="#2E9BFF" stroke-width="2" /><text x="330" y="205" font-family="Microsoft YaHei, Arial, sans-serif" font-size="18" font-weight="700" fill="#2E9BFF" text-anchor="middle">绘制中：看得到海龟位置</text><g id="scene-decoration-p15-01" data-pptx-role="decoration" data-pptx-bounds="0 0 1280 720"><line x1="330" y1="326" x2="330" y2="376" stroke="#22C55E" stroke-width="8" stroke-linecap="round" /><circle cx="330" cy="248" r="34" fill="#FF6FA5" /><circle cx="382" cy="278" r="34" fill="#FF6FA5" /><circle cx="382" cy="338" r="34" fill="#FF6FA5" /><circle cx="330" cy="368" r="34" fill="#FF6FA5" /><circle cx="278" cy="338" r="34" fill="#FF6FA5" /><circle cx="278" cy="278" r="34" fill="#FF6FA5" /><circle cx="330" cy="308" r="23" fill="#FFE26A" stroke="#FF9F1C" stroke-width="2" /><polygon points="378,350 360,381 396,381" fill="#22C55E" stroke="#15803D" stroke-width="2" /></g><text x="330" y="430" font-family="Consolas, Courier New, monospace" font-size="28" font-weight="700" fill="#2E9BFF" text-anchor="middle">t.showturtle()</text><text x="330" y="476" font-family="Microsoft YaHei, Arial, sans-serif" font-size="20" font-weight="700" fill="#203044" text-anchor="middle">绿色小三角就是当前海龟光标</text><rect x="672" y="160" width="560" height="400" rx="30" fill="#FFE2ED" stroke="#FF6FA5" stroke-width="2" /><text x="952" y="205" font-family="Microsoft YaHei, Arial, sans-serif" font-size="18" font-weight="700" fill="#FF6FA5" text-anchor="middle">作品完成：花还在，光标退场</text><g id="scene-decoration-p15-02" data-pptx-role="decoration" data-pptx-bounds="0 0 1280 720"><line x1="952" y1="326" x2="952" y2="376" stroke="#22C55E" stroke-width="8" stroke-linecap="round" /><circle cx="952" cy="248" r="34" fill="#FF6FA5" /><circle cx="1004" cy="278" r="34" fill="#FF6FA5" /><circle cx="1004" cy="338" r="34" fill="#FF6FA5" /><circle cx="952" cy="368" r="34" fill="#FF6FA5" /><circle cx="900" cy="338" r="34" fill="#FF6FA5" /><circle cx="900" cy="278" r="34" fill="#FF6FA5" /><circle cx="952" cy="308" r="23" fill="#FFE26A" stroke="#FF9F1C" stroke-width="2" /></g><text x="952" y="430" font-family="Consolas, Courier New, monospace" font-size="28" font-weight="700" fill="#FF6FA5" text-anchor="middle">t.hideturtle()</text><text x="952" y="476" font-family="Microsoft YaHei, Arial, sans-serif" font-size="20" font-weight="700" fill="#203044" text-anchor="middle">隐藏光标，不会删除已经画好的花</text><text x="1220" y="684" font-family="Microsoft YaHei, Arial, sans-serif" font-size="14" font-weight="400" fill="#60758A" text-anchor="end">阳光积木实验室 · 一次只做清楚一件事</text></svg>