<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" data-pptx-page-role="content" font-family="Microsoft YaHei, Segoe UI, sans-serif">
  <rect width="1280" height="720" fill="#FFFDF5" />
  <g id="header" data-pptx-bounds="54 36 1172 92">
    <rect x="54" y="42" width="164" height="48" rx="24" fill="#2E9BFF" />
    <text x="136" y="74" text-anchor="middle" font-size="22" font-weight="700" fill="#FFFFFF">动手 A</text>
    <text x="246" y="80" font-size="40" font-weight="700" fill="#33415C">6个圆 + 每次左转60°</text>
  </g>
  <g id="flower" data-pptx-bounds="54 156 510 488">
    <rect x="54" y="156" width="510" height="488" rx="34" fill="#FFFFFF" stroke="#D9E8F5" stroke-width="2" />
    <g transform="translate(309 374)">
      <ellipse cx="0" cy="-92" rx="50" ry="92" fill="#FFB2CA" transform="rotate(0)" />
      <ellipse cx="0" cy="-92" rx="50" ry="92" fill="#FF8FB5" transform="rotate(60)" />
      <ellipse cx="0" cy="-92" rx="50" ry="92" fill="#FFB2CA" transform="rotate(120)" />
      <ellipse cx="0" cy="-92" rx="50" ry="92" fill="#FF8FB5" transform="rotate(180)" />
      <ellipse cx="0" cy="-92" rx="50" ry="92" fill="#FFB2CA" transform="rotate(240)" />
      <ellipse cx="0" cy="-92" rx="50" ry="92" fill="#FF8FB5" transform="rotate(300)" />
      <circle r="42" fill="#FFD36A" />
    </g>
    <text x="309" y="604" text-anchor="middle" font-size="22" fill="#667085">6 次循环 × 60° = 360°</text>
  </g>
  <g id="logic" data-pptx-bounds="604 156 622 488">
    <rect x="604" y="156" width="622" height="488" rx="34" fill="#2B3A55" />
    <text x="640" y="208" font-family="Consolas, Courier New, monospace" font-size="22" fill="#9ED0FF">for petal in range(6):</text>
    <text x="680" y="252" font-family="Consolas, Courier New, monospace" font-size="22" fill="#FFFFFF">t.begin_fill()</text>
    <text x="680" y="296" font-family="Consolas, Courier New, monospace" font-size="22" fill="#FFFFFF">t.circle(45)</text>
    <text x="680" y="340" font-family="Consolas, Courier New, monospace" font-size="22" fill="#FFFFFF">t.end_fill()</text>
    <text x="680" y="384" font-family="Consolas, Courier New, monospace" font-size="22" fill="#FFD36A">t.left(60)</text>
    <rect x="640" y="438" width="534" height="142" rx="24" fill="#FFFFFF" opacity="0.1" />
    <text x="672" y="482" font-size="22" font-weight="700" fill="#FFB2CA">想一想</text>
    <text x="672" y="524" font-size="22" fill="#FFFFFF">range(6) 决定花瓣数量</text>
    <text x="672" y="560" font-size="22" fill="#FFFFFF">left(60) 决定环形分布</text>
  </g>
</svg>