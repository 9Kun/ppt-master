<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" data-pptx-page-role="content" font-family="Microsoft YaHei, Arial, sans-serif"><rect x="0" y="0" width="1280" height="720" rx="0" fill="#FFFDF5" id="page-bg" /><circle cx="1210" cy="35" r="66" fill="#EAF5FF" opacity="0.9" /><circle cx="1250" cy="95" r="26" fill="#FFE2ED" opacity="0.9" /><rect x="34" y="28" width="16" height="54" rx="8" fill="#FF9F1C" /><text x="64" y="70" font-family="YouYuan, Microsoft YaHei, sans-serif" font-size="40" font-weight="700" fill="#203044" text-anchor="start">做完，还要能讲出来</text><text x="66" y="100" font-family="Microsoft YaHei, Arial, sans-serif" font-size="17" font-weight="400" fill="#60758A" text-anchor="start">先看清成功标准，再开始写代码</text><rect x="1000" y="34" width="210" height="42" rx="21" fill="#EAF5FF" /><text x="1105" y="62" font-family="Microsoft YaHei, Arial, sans-serif" font-size="16" font-weight="700" fill="#2E9BFF" text-anchor="middle">项目启动</text><rect x="48" y="655" width="128" height="42" rx="21" fill="#FFF2DC" /><text x="112" y="683" font-family="Microsoft YaHei, Arial, sans-serif" font-size="15" font-weight="700" fill="#FF9F1C" text-anchor="middle">P12</text><rect x="48" y="164" width="370" height="310" rx="28" fill="#FFFFFF" stroke="#CFE5F8" stroke-width="2" /><rect x="48" y="164" width="10" height="310" rx="8" fill="#2E9BFF" /><circle cx="90" cy="210" r="22" fill="#2E9BFF" /><text x="90" y="218" font-family="Microsoft YaHei, Arial, sans-serif" font-size="18" font-weight="700" fill="#FFFFFF" text-anchor="middle">1</text><text x="126" y="218" font-family="Microsoft YaHei, Arial, sans-serif" font-size="25" font-weight="700" fill="#203044" text-anchor="start">能运行</text><text x="78" y="262" font-family="Microsoft YaHei, Arial, sans-serif" font-size="19" font-weight="400" fill="#60758A" text-anchor="start"><tspan x="78" dy="0">基础版能够完整运行，没有</tspan><tspan x="78" dy="30">因为拼写或缩进中断。</tspan></text><rect x="78" y="360" width="310" height="68" rx="18" fill="#EAF5FF" /><circle cx="108" cy="394" r="16" fill="#2E9BFF" /><path d="M100 394 L106 400 L117 387" fill="none" stroke="#FFFFFF" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" /><text x="136" y="401" font-family="Microsoft YaHei, Arial, sans-serif" font-size="16" font-weight="700" fill="#2072B8" text-anchor="start">验收：程序能完整跑到结束</text><rect x="442" y="164" width="370" height="310" rx="28" fill="#FFFFFF" stroke="#CFE5F8" stroke-width="2" /><rect x="442" y="164" width="10" height="310" rx="8" fill="#FF6FA5" /><circle cx="484" cy="210" r="22" fill="#FF6FA5" /><text x="484" y="218" font-family="Microsoft YaHei, Arial, sans-serif" font-size="18" font-weight="700" fill="#FFFFFF" text-anchor="middle">2</text><text x="520" y="218" font-family="Microsoft YaHei, Arial, sans-serif" font-size="25" font-weight="700" fill="#203044" text-anchor="start">够完整</text><text x="472" y="262" font-family="Microsoft YaHei, Arial, sans-serif" font-size="19" font-weight="400" fill="#60758A" text-anchor="start"><tspan x="472" dy="0">作品包含花瓣、花心、花茎</tspan><tspan x="472" dy="30">三个部分。</tspan></text><rect x="472" y="360" width="310" height="68" rx="18" fill="#FFE2ED" /><circle cx="502" cy="394" r="16" fill="#FF6FA5" /><path d="M494 394 L500 400 L511 387" fill="none" stroke="#FFFFFF" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" /><text x="530" y="401" font-family="Microsoft YaHei, Arial, sans-serif" font-size="16" font-weight="700" fill="#B83E68" text-anchor="start">验收：画面能看见三个部分</text><rect x="836" y="164" width="370" height="310" rx="28" fill="#FFFFFF" stroke="#CFE5F8" stroke-width="2" /><rect x="836" y="164" width="10" height="310" rx="8" fill="#FF9F1C" /><circle cx="878" cy="210" r="22" fill="#FF9F1C" /><text x="878" y="218" font-family="Microsoft YaHei, Arial, sans-serif" font-size="18" font-weight="700" fill="#FFFFFF" text-anchor="middle">3</text><text x="914" y="218" font-family="Microsoft YaHei, Arial, sans-serif" font-size="25" font-weight="700" fill="#203044" text-anchor="start">说得清</text><text x="866" y="262" font-family="Microsoft YaHei, Arial, sans-serif" font-size="19" font-weight="400" fill="#60758A" text-anchor="start"><tspan x="866" dy="0">能指出自己修改的一处内容，</tspan><tspan x="866" dy="30">并解释变化。</tspan></text><rect x="866" y="360" width="310" height="68" rx="18" fill="#FFF2DC" /><circle cx="896" cy="394" r="16" fill="#FF9F1C" /><path d="M888 394 L894 400 L905 387" fill="none" stroke="#FFFFFF" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" /><text x="924" y="401" font-family="Microsoft YaHei, Arial, sans-serif" font-size="16" font-weight="700" fill="#B96800" text-anchor="start">验收：能说出“我改了什么”</text><rect x="48" y="506" width="1158" height="104" rx="26" fill="#E9FBEF" stroke="#22C55E" stroke-width="2" /><text x="627" y="548" font-family="Microsoft YaHei, Arial, sans-serif" font-size="17" font-weight="700" fill="#207A45" text-anchor="middle">今天的作品标准不是“看起来差不多”，而是三项都能被验证</text><text x="627" y="583" font-family="Microsoft YaHei, Arial, sans-serif" font-size="23" font-weight="700" fill="#22C55E" text-anchor="middle">先跑通基础版 → 再只改 1–2 项 → 最后展示说明</text><text x="1220" y="684" font-family="Microsoft YaHei, Arial, sans-serif" font-size="14" font-weight="400" fill="#60758A" text-anchor="end">阳光积木实验室 · 一次只做清楚一件事</text></svg>