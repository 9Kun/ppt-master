<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" data-pptx-page-role="content" font-family="Microsoft YaHei, Arial, sans-serif">
  <rect id="background" data-pptx-role="background" width="1280" height="720" fill="#FFFDF5"/>
  <g id="header" data-pptx-bounds="54 36 1120 84"><text x="54" y="84" font-family="YouYuan, Microsoft YaHei, sans-serif" font-size="46" font-weight="700" fill="#203044">卡住时，先查这三处</text><text x="54" y="116" font-size="20" fill="#FF6FA5">不要删掉全部重来</text></g>
  <g id="problem-slow" data-pptx-bounds="64 156 360 420"><rect x="64" y="156" width="360" height="420" rx="34" fill="#FFE2ED"/><use data-icon="tabler-filled/alert-triangle" x="102" y="194" width="50" height="50" fill="#FF6FA5"/><text x="174" y="228" font-size="28" font-weight="700" fill="#203044">花瓣画得很慢</text><text x="102" y="304" font-size="24" fill="#203044">先检查速度设置</text><rect x="102" y="354" width="284" height="84" rx="22" fill="#FFFFFF"/><text x="244" y="407" text-anchor="middle" font-family="Consolas, monospace" font-size="28" font-weight="700" fill="#22C55E">t.speed(0)</text><text x="102" y="502" font-size="20" fill="#60758A">0 表示最快绘制</text></g>
  <g id="problem-direction" data-pptx-bounds="460 136 360 440"><rect x="460" y="136" width="360" height="440" rx="34" fill="#FFF2DC"/><use data-icon="tabler-filled/alert-triangle" x="498" y="174" width="50" height="50" fill="#FF9F1C"/><text x="570" y="208" font-size="28" font-weight="700" fill="#203044">花茎方向错了</text><text x="498" y="284" font-size="24" fill="#203044">向下通常是 270°</text><rect x="498" y="334" width="284" height="84" rx="22" fill="#FFFFFF"/><text x="640" y="387" text-anchor="middle" font-family="Consolas, monospace" font-size="25" font-weight="700" fill="#22C55E">t.setheading(270)</text><text x="498" y="482" font-size="20" fill="#60758A">再运行观察方向</text></g>
  <g id="problem-long" data-pptx-bounds="856 156 360 420"><rect x="856" y="156" width="360" height="420" rx="34" fill="#EAF5FF"/><use data-icon="tabler-filled/alert-triangle" x="894" y="194" width="50" height="50" fill="#2E9BFF"/><text x="966" y="228" font-size="28" font-weight="700" fill="#203044">代码太长看不懂</text><text x="894" y="304" font-size="24" fill="#203044">回到教师半成品</text><rect x="894" y="354" width="284" height="118" rx="22" fill="#FFFFFF"/><text x="1036" y="398" text-anchor="middle" font-size="22" font-weight="700" fill="#2E9BFF">逐段运行</text><text x="1036" y="438" text-anchor="middle" font-size="22" fill="#203044">花瓣 → 花心 → 花茎</text><text x="894" y="522" font-size="20" fill="#60758A">不要求从空白重写全部代码</text></g>
  <g id="fix-takeaway" data-pptx-bounds="200 612 880 54"><text x="640" y="646" text-anchor="middle" font-size="24" font-weight="700" fill="#22C55E">先检查最可能的原因，再只改一处</text></g>
</svg>
