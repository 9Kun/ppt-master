  <rect id="background" data-pptx-role="background" width="1280" height="720" fill="#FFFDF5"/>
  <g id="header" data-pptx-bounds="54 30 1172 82"><rect x="54" y="34" width="176" height="46" rx="23" fill="#2E9BFF"/><text x="142" y="65" text-anchor="middle" font-size="20" font-weight="700" fill="#FFFFFF">十题热身</text><text x="258" y="72" font-size="40" font-weight="700" fill="#203044">5–6 · 位置导航</text><text x="1226" y="68" text-anchor="end" font-size="18" fill="#60758A">一个去坐标，一个回中心</text></g>
  <g id="question-1" data-pptx-bounds="54 126 1172 230" data-pptx-role="decoration"><rect x="54" y="126" width="1172" height="230" rx="30" fill="#FFFFFF" stroke="#CFE5F8" stroke-width="2"/><circle cx="102" cy="176" r="28" fill="#2E9BFF"/><text x="102" y="185" text-anchor="middle" font-size="22" font-weight="700" fill="#FFFFFF">5</text><text x="150" y="186" font-size="28" font-weight="700" fill="#203044">移动到指定坐标用什么？</text><rect x="690" y="180" width="484" height="112" rx="24" fill="#FFF2DC"/><text x="932" y="228" text-anchor="middle" font-size="22" font-weight="700" fill="#FF9F1C">点击揭晓</text><text x="932" y="264" text-anchor="middle" font-size="18" fill="#60758A">坐标像地图上的目的地</text></g>
  <g id="answer-q1" data-pptx-bounds="690 180 484 112"><rect x="690" y="180" width="484" height="112" rx="24" fill="#E9FBEF"/><text x="932" y="230" text-anchor="middle" font-family="Consolas, monospace" font-size="30" font-weight="700" fill="#22C55E">goto() 或 setpos()</text><text x="932" y="270" text-anchor="middle" font-size="18" fill="#203044">括号里填写 x、y 坐标。</text></g>
  <g id="reveal-q1-hit" data-pptx-bounds="690 180 484 112"><rect x="690" y="180" width="484" height="112" rx="24" fill="#FFFFFF" fill-opacity="0.001"/></g>
  <g id="question-2" data-pptx-bounds="54 382 1172 230" data-pptx-role="decoration"><rect x="54" y="382" width="1172" height="230" rx="30" fill="#FFFFFF" stroke="#CFE5F8" stroke-width="2"/><circle cx="102" cy="432" r="28" fill="#FF9F1C"/><text x="102" y="441" text-anchor="middle" font-size="22" font-weight="700" fill="#FFFFFF">6</text><text x="150" y="442" font-size="28" font-weight="700" fill="#203044">回到画布中心用什么？</text><rect x="690" y="436" width="484" height="112" rx="24" fill="#FFF2DC"/><text x="932" y="484" text-anchor="middle" font-size="22" font-weight="700" fill="#FF9F1C">点击揭晓</text><text x="932" y="520" text-anchor="middle" font-size="18" fill="#60758A">像按下“一键回家”</text></g>
  <g id="answer-q2" data-pptx-bounds="690 436 484 112"><rect x="690" y="436" width="484" height="112" rx="24" fill="#E9FBEF"/><use data-icon="tabler-filled/home" x="804" y="464" width="42" height="42" fill="#22C55E"/><text x="956" y="494" text-anchor="middle" font-family="Consolas, monospace" font-size="34" font-weight="700" fill="#22C55E">home()</text><text x="932" y="530" text-anchor="middle" font-size="18" fill="#203044">回到中心并恢复初始方向。</text></g>
  <g id="reveal-q2-hit" data-pptx-bounds="690 436 484 112"><rect x="690" y="436" width="484" height="112" rx="24" fill="#FFFFFF" fill-opacity="0.001"/></g>
