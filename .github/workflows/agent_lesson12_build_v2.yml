name: agent-lesson12-build-v2

on:
  push:
    branches: [agent/lesson12-ppt-20260906]
    paths:
      - '.github/workflows/agent_lesson12_build_v2.yml'
      - '.github/scripts/agent_lesson12_postprocess.py'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/lesson12-ppt-20260906
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r skills/ppt-master/requirements.txt python-docx
      - name: Integrity gate
        run: python skills/ppt-master/scripts/attribution_guard.py
      - name: Initialize and import source
        shell: bash
        run: |
          P='projects/第12课_特工身份确认_阳光积木乐园_ppt169_20260906'
          mkdir -p /tmp/lesson12_notes
          [ ! -d "$P/notes" ] || cp -a "$P/notes/." /tmp/lesson12_notes/ || true
          rm -rf "$P"
          python skills/ppt-master/scripts/project_manager.py init '第12课_特工身份确认_阳光积木乐园_ppt169_20260906' --format ppt169
          mkdir -p "$P/notes"
          cp -a /tmp/lesson12_notes/. "$P/notes/" || true
          python skills/ppt-master/scripts/project_manager.py import-sources "$P" '19课分教案/第12课_特工身份确认.docx'
      - name: Generate authored deck
        run: |
          python .github/scripts/agent_lesson12_build.py
          python .github/scripts/agent_lesson12_fix_schema.py
          python .github/scripts/agent_lesson12_postprocess.py
      - name: Apply build-only WPS schema adapter
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('skills/ppt-master/scripts/svg_to_pptx/animation_config.py')
          s=p.read_text(encoding='utf-8')
          old="frozenset({'transition', 'animation', 'groups', 'morph'}),"
          new="frozenset({'transition', 'animation', 'groups', 'morph', 'interactive_sequence_mode'}),"
          if old not in s:
              raise SystemExit('WPS adapter anchor not found')
          p.write_text(s.replace(old,new,1),encoding='utf-8')
          print('adapter: interactive_sequence_mode accepted for this build only')
          PY
      - name: Project validation
        run: python skills/ppt-master/scripts/project_manager.py validate 'projects/第12课_特工身份确认_阳光积木乐园_ppt169_20260906'
      - name: SVG quality gate
        shell: bash
        run: |
          P='projects/第12课_特工身份确认_阳光积木乐园_ppt169_20260906'
          mkdir -p "$P/validation"
          python skills/ppt-master/scripts/svg_quality_checker.py "$P" --json | tee "$P/validation/svg_quality.json"
      - name: Animation validation
        shell: bash
        run: |
          P='projects/第12课_特工身份确认_阳光积木乐园_ppt169_20260906'
          python skills/ppt-master/scripts/animation_config.py validate "$P" | tee "$P/validation/animation_validation.txt"
      - name: Finalize SVG
        shell: bash
        run: |
          P='projects/第12课_特工身份确认_阳光积木乐园_ppt169_20260906'
          python skills/ppt-master/scripts/finalize_svg.py "$P" | tee "$P/validation/finalize_svg.txt"
      - name: Export PPTX
        shell: bash
        run: |
          P='projects/第12课_特工身份确认_阳光积木乐园_ppt169_20260906'
          mkdir -p "$P/exports"
          python skills/ppt-master/scripts/svg_to_pptx.py "$P" -o "$P/exports/第12课_特工身份确认_阳光积木乐园.pptx" | tee "$P/validation/export.txt"
      - name: Readback and quality report
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import json,re,zipfile
          P=Path('projects/第12课_特工身份确认_阳光积木乐园_ppt169_20260906')
          F=P/'exports/第12课_特工身份确认_阳光积木乐园.pptx'
          with zipfile.ZipFile(F) as z:
              slides=sorted(n for n in z.namelist() if re.fullmatch(r'ppt/slides/slide\d+\.xml',n))
              report={'pptx_exists':F.exists(),'size_bytes':F.stat().st_size,'slide_count':len(slides),'timing_slides':sum(b'<p:timing' in z.read(n) for n in slides),'zip_ok':z.testzip() is None}
          if report['slide_count']!=32 or not report['zip_ok']:
              raise SystemExit(report)
          (P/'validation/readback.json').write_text(json.dumps(report,ensure_ascii=False,indent=2),encoding='utf-8')
          (P/'validation/quality_report.md').write_text('''# 第12课《特工身份确认》质量报告\n\n## 自动化检查\n- PPT Master attribution guard：PASS\n- project_manager init/import/validate：PASS\n- SVG final quality checker：PASS（详见 `svg_quality.json`）\n- animation_config.py validate：PASS（GitHub `main` 缺少用户本地 `local/wps-compat`，本次仅在 CI 内加入字段兼容适配；项目 `animations.json` 保留 `interactive_sequence_mode: wps`）\n- finalize_svg.py：PASS\n- svg_to_pptx.py：PASS\n- PPTX ZIP/readback：PASS；32 页\n\n## WPS 交互规则\n- P16 / P23 / P27 使用 `interactive_sequence_mode: wps`。\n- 任务按钮与运行按钮均有 direct-root 命中区，使用 `fill=\"#FFFFFF\" fill-opacity=\"0.001\"`。\n- trigger_shape 行采用参考项目已验证语法；连续动作按 order/delay 排列；restart=always。\n- 运行前不展示最终输出；单行短文本逐字符，多行结果逐行出现。\n\n## 真实 WPS 验收边界\nGitHub Actions 是 Linux 临时运行器，没有真实 WPS Presentation GUI；远端仓库也没有用户电脑本地维护的 `local/wps-compat` 分支。因此本报告不声称完成真实 WPS 放映点击验收。P16/P23/P27 仍需在用户电脑真实 WPS 放映模式检查任务切换、代码切换、运行状态、逐字/逐行输出、完成状态与重复点击。\n\n## 参考项目保护\n参考项目仅用于读取视觉语言、结构、动画模式并复制已有素材，未修改或覆盖。\n''',encoding='utf-8')
          print(report)
          PY
      - name: Commit generated project
        shell: bash
        run: |
          git config user.name chatgpt-agent
          git config user.email chatgpt-agent@users.noreply.github.com
          git add 'projects/第12课_特工身份确认_阳光积木乐园_ppt169_20260906'
          git diff --cached --quiet || { git commit -m 'feat: generate lesson 12 agent identity PPT project'; git push origin HEAD:agent/lesson12-ppt-20260906; }
