name: Lesson06 clean visual revision validation

on:
  push:
    branches:
      - fix/lesson06-visual-revision-clean

permissions:
  contents: write

jobs:
  validate-export:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    env:
      PROJECT: projects/Python应用课_第06课_阶段测评与复盘_阳光积木实验室_20260905_ppt169_20260905
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Attribution guard first
        run: python3 skills/ppt-master/scripts/attribution_guard.py

      - name: Install PPT Master dependencies
        run: python3 -m pip install -r skills/ppt-master/requirements.txt

      - name: Official SVG quality gate
        run: python3 skills/ppt-master/scripts/svg_quality_checker.py "$PROJECT"

      - name: Rebuild svg_final from canonical svg_output
        run: python3 skills/ppt-master/scripts/finalize_svg.py "$PROJECT"

      - name: Canonical final release SVG gate
        run: python3 skills/ppt-master/scripts/svg_quality_checker.py "$PROJECT" --canonical-authoring --stage final --json

      - name: Export new native PPTX
        run: python3 skills/ppt-master/scripts/svg_to_pptx.py "$PROJECT"

      - name: Restore every untouched svg_final exactly
        shell: bash
        run: |
          python3 - <<'PY'
          import subprocess
          from pathlib import Path
          project = Path("projects/Python应用课_第06课_阶段测评与复盘_阳光积木实验室_20260905_ppt169_20260905")
          touched = {
              "06_热身1-2_起步命令.svg", "07_热身3-4_重复动作.svg", "08_热身5-6_位置导航.svg",
              "09_热身7-8_颜色填充.svg", "10_热身9-10_背景与圆.svg", "13_新命令小实验.svg",
              "15_显示与隐藏海龟.svg", "23_选择题1-2.svg", "24_选择题3-4.svg", "25_选择题5-6.svg",
              "26_选择题7-8.svg", "30_微项目装配站.svg", "35_三个常见问题.svg",
          }
          for path in sorted((project / "svg_final").glob("*.svg")):
              if path.name not in touched:
                  subprocess.run(["git", "checkout", "HEAD", "--", str(path)], check=True)
          PY

      - name: Verify P01-P04 unchanged
        shell: bash
        run: |
          git diff --exit-code HEAD -- \
            "$PROJECT/svg_output/01_阶段测评与复盘.svg" \
            "$PROJECT/svg_output/02_今天的120分钟.svg" \
            "$PROJECT/svg_output/03_今天要带走什么.svg" \
            "$PROJECT/svg_output/04_十题热身赛.svg" \
            "$PROJECT/svg_final/01_阶段测评与复盘.svg" \
            "$PROJECT/svg_final/02_今天的120分钟.svg" \
            "$PROJECT/svg_final/03_今天要带走什么.svg" \
            "$PROJECT/svg_final/04_十题热身赛.svg"

      - name: Commit validated final SVGs, report and PPTX
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$PROJECT/svg_final" "$PROJECT/exports"
          if [ -f "$PROJECT/validation/svg_quality_report.json" ]; then
            git add "$PROJECT/validation/svg_quality_report.json"
          fi
          if git diff --cached --quiet; then
            echo "No generated changes to commit"
            exit 0
          fi
          git commit -m "fix(slides): validate and export lesson06 visual revision"
          git push origin HEAD:fix/lesson06-visual-revision-clean
