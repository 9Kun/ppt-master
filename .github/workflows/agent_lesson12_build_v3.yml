name: agent-lesson12-build-v3

on:
  push:
    branches:
      - agent/lesson12-ppt-20260906
    paths:
      - '.github/workflows/agent_lesson12_build_v3.yml'
      - '.github/scripts/agent_lesson12_build.py'
      - '.github/scripts/agent_lesson12_fix_schema.py'
      - '.github/scripts/agent_lesson12_postprocess.py'
      - '.github/scripts/agent_lesson12_repair.py'
      - '.github/scripts/agent_lesson12_contract_fix.py'
      - '.github/scripts/agent_lesson12_wps_audit.py'
      - '.github/scripts/agent_lesson12_release_audit.py'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: agent/lesson12-ppt-20260906
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r skills/ppt-master/requirements.txt python-docx

      - name: PPT Master integrity gate
        run: python skills/ppt-master/scripts/attribution_guard.py

      - name: Initialize independent project and import DOCX
        shell: bash
        run: |
          P='projects/第12课_特工身份确认_阳光积木乐园_ppt169_20260906'
          mkdir -p /tmp/lesson12_notes
          [ ! -d "$P/notes" ] || cp -a "$P/notes/." /tmp/lesson12_notes/ || true
          rm -rf "$P"
          python skills/ppt-master/scripts/project_manager.py init '第12课_特工身份确认_阳光积木乐园_ppt169_20260906' --format ppt169
          mkdir -p "$P/notes"
          cp -a /tmp/lesson12_notes/. "$P/notes/" || true
          python skills/ppt-master/scripts/project_manager.py import-sources "$P" '19课分教案/第12课_特工身份确认.docx'

      - name: Generate and repair sources
        run: |
          python .github/scripts/agent_lesson12_build.py
          python .github/scripts/agent_lesson12_fix_schema.py
          python .github/scripts/agent_lesson12_postprocess.py

      - name: Build-only WPS schema adapter
        run: python -c "from pathlib import Path; p=Path('skills/ppt-master/scripts/svg_to_pptx/animation_config.py'); s=p.read_text(encoding='utf-8'); old=\"frozenset({'transition', 'animation', 'groups', 'morph'}),\"; new=\"frozenset({'transition', 'animation', 'groups', 'morph', 'interactive_sequence_mode'}),\"; assert old in s, 'WPS adapter anchor not found'; p.write_text(s.replace(old,new,1),encoding='utf-8')"

      - name: Project schema validation
        run: python skills/ppt-master/scripts/project_manager.py validate 'projects/第12课_特工身份确认_阳光积木乐园_ppt169_20260906'

      - name: Full canonical final SVG hard gate
        shell: bash
        run: |
          P='projects/第12课_特工身份确认_阳光积木乐园_ppt169_20260906'
          mkdir -p "$P/validation"
          python skills/ppt-master/scripts/svg_quality_checker.py "$P" --canonical-authoring --stage final --json | tee "$P/validation/svg_quality_full.json"
          echo 0 > "$P/validation/svg_quality_full_exit_code.txt"

      - name: WPS interaction hard gate
        run: python .github/scripts/agent_lesson12_wps_audit.py

      - name: Animation config validation
        shell: bash
        run: |
          P='projects/第12课_特工身份确认_阳光积木乐园_ppt169_20260906'
          python skills/ppt-master/scripts/animation_config.py validate "$P" | tee "$P/validation/animation_validation.txt"

      - name: Finalize SVG
        shell: bash
        run: |
          P='projects/第12课_特工身份确认_阳光积木乐园_ppt169_20260906'
          python skills/ppt-master/scripts/finalize_svg.py "$P" | tee "$P/validation/finalize_svg.txt"

      - name: Standard release PPTX export
        shell: bash
        run: |
          P='projects/第12课_特工身份确认_阳光积木乐园_ppt169_20260906'
          mkdir -p "$P/exports"
          python skills/ppt-master/scripts/svg_to_pptx.py "$P" -o "$P/exports/第12课_特工身份确认_阳光积木乐园.pptx" | tee "$P/validation/export.txt"

      - name: PPTX readback and quality report
        run: python .github/scripts/agent_lesson12_release_audit.py

      - name: Preserve build and repair sources
        shell: bash
        run: |
          P='projects/第12课_特工身份确认_阳光积木乐园_ppt169_20260906'
          cp .github/scripts/agent_lesson12_build.py "$P/notes/build_deck.py"
          cp .github/scripts/agent_lesson12_fix_schema.py "$P/notes/fix_schema.py"
          cp .github/scripts/agent_lesson12_postprocess.py "$P/notes/postprocess.py"
          cp .github/scripts/agent_lesson12_repair.py "$P/notes/repair.py"
          cp .github/scripts/agent_lesson12_contract_fix.py "$P/notes/contract_fix.py"
          cp .github/scripts/agent_lesson12_wps_audit.py "$P/notes/wps_audit.py"
          cp .github/scripts/agent_lesson12_release_audit.py "$P/notes/release_audit.py"

      - name: Commit repaired project
        shell: bash
        run: |
          git config user.name chatgpt-agent
          git config user.email chatgpt-agent@users.noreply.github.com
          git add 'projects/第12课_特工身份确认_阳光积木乐园_ppt169_20260906'
          if git diff --cached --quiet; then
            echo 'No project changes to commit.'
          else
            git commit -m 'fix: self-audit and repair lesson 12 PPT'
            git push origin HEAD:agent/lesson12-ppt-20260906
          fi
