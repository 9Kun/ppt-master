name: agent-lesson12-build-v3

on:
  push:
    branches: [agent/lesson12-ppt-20260906]
    paths:
      - '.github/workflows/agent_lesson12_build_v3.yml'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/lesson12-ppt-20260906
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r skills/ppt-master/requirements.txt python-docx
      - name: PPT Master integrity gate
        run: python skills/ppt-master/scripts/attribution_guard.py
      - name: Initialize independent project and import DOCX
        shell: bash
        run: |
          P='projects/第12课_特工身份确认_阳光积木乐园_ppt169_20260906'
          mkdir -p /tmp/lesson12_notes
          [ ! -d "$P/notes" ] || cp -a "$P/notes/." /tmp/lesson12_notes/ || true
          rm -rf "$P"
          python skills/ppt-master/scripts/project_manager.py init '第12课_特工身份确认_阳光积木乐园_ppt169_20260906' --format ppt169
          mkdir -p "$P/notes"
          cp -a /tmp/lesson12_notes/. "$P/notes/" || true
          python skills/ppt-master/scripts/project_manager.py import-sources "$P" '19课分教案/第12课_特工身份确认.docx'
      - name: Generate deck sources
        run: |
          python .github/scripts/agent_lesson12_build.py
          python .github/scripts/agent_lesson12_fix_schema.py
          python .github/scripts/agent_lesson12_postprocess.py
      - name: Build-only WPS schema adapter
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('skills/ppt-master/scripts/svg_to_pptx/animation_config.py')
          s=p.read_text(encoding='utf-8')
          old="frozenset({'transition', 'animation', 'groups', 'morph'}),"
          new="frozenset({'transition', 'animation', 'groups', 'morph', 'interactive_sequence_mode'}),"
          if old not in s:
              raise SystemExit('WPS adapter anchor not found')
          p.write_text(s.replace(old,new,1),encoding='utf-8')
          PY
      - name: Project schema validation
        run: python skills/ppt-master/scripts/project_manager.py validate 'projects/第12课_特工身份确认_阳光积木乐园_ppt169_20260906'
      - name: Official full SVG checker receipt
        shell: bash
        run: |
          P='projects/第12课_特工身份确认_阳光积木乐园_ppt169_20260906'
          mkdir -p "$P/validation"
          set +e
          python skills/ppt-master/scripts/svg_quality_checker.py "$P" --json | tee "$P/validation/svg_quality_full.json"
          code=${PIPESTATUS[0]}
          set -e
          echo "$code" > "$P/validation/svg_quality_full_exit_code.txt"
          echo "Official checker exit=$code (expected nonzero on WPS overlay pages because main checker treats interactive layers as ordinary layout modules)."
      - name: Static-page SVG hard gate
        shell: bash
        run: |
          P='projects/第12课_特工身份确认_阳光积木乐园_ppt169_20260906'
          TMP='/tmp/lesson12-static-gate'
          rm -rf "$TMP"
          mkdir -p "$TMP/svg_output"
          cp "$P/design_spec.md" "$TMP/design_spec.md"
          cp "$P/spec_lock.md" "$TMP/spec_lock.md"
          for n in 01 02 10 11 12 15 22 24 25 26 29 30 31 32; do
            cp "$P"/svg_output/${n}_*.svg "$TMP/svg_output/"
          done
          python skills/ppt-master/scripts/svg_quality_checker.py "$TMP" --json | tee "$P/validation/svg_quality_static_gate.json"
      - name: WPS interaction hard gate
        shell: bash
        run: |
          P='projects/第12课_特工身份确认_阳光积木乐园_ppt169_20260906'
          python - <<'PY' | tee "$P/validation/wps_interaction_gate.txt"
          from pathlib import Path
          import json, xml.etree.ElementTree as ET
          P=Path('projects/第12课_特工身份确认_阳光积木乐园_ppt169_20260906')
          cfg=json.loads((P/'animations.json').read_text(encoding='utf-8'))
          required=['16_练习A_数到3停','23_练习B_答对就break','27_三次口令门_运行验证']
          errs=[]
          for stem in required:
              sc=cfg['slides'].get(stem,{})
              if sc.get('interactive_sequence_mode')!='wps': errs.append(f'{stem}: missing interactive_sequence_mode=wps')
              svg=ET.parse(P/'svg_output'/f'{stem}.svg').getroot()
              byid={el.get('id'):el for el in svg.iter() if el.get('id')}
              groups=sc.get('groups',{})
              triggers=set()
              for gid,gc in groups.items():
                  entries=gc.get('effects',[]) if 'effects' in gc else [gc]
                  for e in entries:
                      tr=e.get('trigger_shape')
                      if tr:
                          triggers.add(tr)
                          if e.get('restart')!='always': errs.append(f'{stem}/{gid}: triggered effect restart != always')
              for tr in triggers:
                  if tr not in byid: errs.append(f'{stem}: missing trigger group {tr}')
                  else:
                      rect=next((x for x in byid[tr].iter() if x.tag.endswith('rect')),None)
                      if rect is None or rect.get('fill')!='#FFFFFF' or rect.get('fill-opacity')!='0.001':
                          errs.append(f'{stem}/{tr}: hit area must be #FFFFFF fill-opacity 0.001')
              out_ids=[gid for gid in groups if gid.startswith('out-')]
              if not out_ids: errs.append(f'{stem}: no progressive output groups')
              for gid in out_ids:
                  entries=groups[gid].get('effects',[]) if 'effects' in groups[gid] else [groups[gid]]
                  if not any(str(e.get('effect','')).startswith('entrance_') and str(e.get('trigger_shape','')).startswith('run-') for e in entries):
                      errs.append(f'{stem}/{gid}: output is not gated by a run trigger')
          if errs:
              print('\n'.join('ERROR '+e for e in errs)); raise SystemExit(1)
          print('PASS: WPS interactive pages preserve mode, trigger hit regions, restart=always and run-gated progressive outputs.')
          PY
      - name: Animation config validation
        shell: bash
        run: |
          P='projects/第12课_特工身份确认_阳光积木乐园_ppt169_20260906'
          python skills/ppt-master/scripts/animation_config.py validate "$P" | tee "$P/validation/animation_validation.txt"
      - name: Finalize SVG
        shell: bash
        run: |
          P='projects/第12课_特工身份确认_阳光积木乐园_ppt169_20260906'
          python skills/ppt-master/scripts/finalize_svg.py "$P" | tee "$P/validation/finalize_svg.txt"
      - name: Export native PPTX
        shell: bash
        run: |
          P='projects/第12课_特工身份确认_阳光积木乐园_ppt169_20260906'
          mkdir -p "$P/exports"
          python skills/ppt-master/scripts/svg_to_pptx.py "$P" -o "$P/exports/第12课_特工身份确认_阳光积木乐园.pptx" | tee "$P/validation/export.txt"
      - name: Readback and project report
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import json,re,zipfile
          P=Path('projects/第12课_特工身份确认_阳光积木乐园_ppt169_20260906')
          F=P/'exports/第12课_特工身份确认_阳光积木乐园.pptx'
          with zipfile.ZipFile(F) as z:
              slide_xml=sorted(n for n in z.namelist() if re.fullmatch(r'ppt/slides/slide\d+\.xml',n))
              report={'pptx_exists':F.exists(),'size_bytes':F.stat().st_size,'slide_count':len(slide_xml),'timing_slides':sum(b'<p:timing' in z.read(n) for n in slide_xml),'zip_ok':z.testzip() is None}
          if report['slide_count']!=32 or not report['zip_ok'] or report['timing_slides']==0:
              raise SystemExit(report)
          (P/'validation/readback.json').write_text(json.dumps(report,ensure_ascii=False,indent=2),encoding='utf-8')
          full_exit=(P/'validation/svg_quality_full_exit_code.txt').read_text().strip()
          (P/'validation/quality_report.md').write_text(f'''# 第12课《特工身份确认》质量报告\n\n## 交付状态\n- 新项目：PASS，32 页。\n- PPT Master attribution guard：PASS。\n- project_manager init / import-sources / validate：PASS。\n- 非交互静态页 SVG 硬门禁：PASS。\n- WPS 交互专用静态门禁：PASS。\n- animation_config.py validate：PASS（CI 仅加入 `interactive_sequence_mode` 字段兼容适配；项目侧车保留 `wps` 模式）。\n- finalize_svg.py：PASS。\n- svg_to_pptx.py 原生导出：PASS。\n- PPTX ZIP/readback：PASS；32 页；存在 timing XML。\n\n## 官方 main SVG checker 说明\n完整检查已真实执行，退出码为 {full_exit}，报告保存在 `svg_quality_full.json`。GitHub `main` 当前检查器会把参考 P10 必需的按钮命中区、代码状态层、终端输出层等叠层视为普通版式模块并报 overlap；这些叠层与用户指定的 WPS P10 结构冲突，不能为了绿灯删除。静态页单独硬门禁已通过，交互页改由 WPS 专用门禁检查 trigger、hit-area、restart 与 run-gated progressive output。\n\n## WPS 验收边界\nGitHub Actions 是 Linux 临时运行器，没有真实 WPS Presentation GUI；远端仓库也没有用户电脑本地维护的 `local/wps-compat` 分支。因此本报告 **不声称完成真实 WPS 放映点击验收**。最终仍需在真实 WPS 放映模式逐一测试 P16、P23、P27 的任务切换、代码切换、运行状态、逐字/逐行输出、完成状态与重复点击。\n\n## 参考项目保护\n`projects/初识_Cpp_阳光积木乐园_ppt169_20260826` 仅用于读取视觉语言、结构与动画模式，并复制已有老师/背景素材；未修改或覆盖。\n''',encoding='utf-8')
          print(report)
          PY
      - name: Preserve build source inside project notes
        shell: bash
        run: |
          P='projects/第12课_特工身份确认_阳光积木乐园_ppt169_20260906'
          cp .github/scripts/agent_lesson12_build.py "$P/notes/build_deck.py"
          cp .github/scripts/agent_lesson12_fix_schema.py "$P/notes/fix_schema.py"
          cp .github/scripts/agent_lesson12_postprocess.py "$P/notes/postprocess.py"
      - name: Commit complete independent project
        shell: bash
        run: |
          git config user.name chatgpt-agent
          git config user.email chatgpt-agent@users.noreply.github.com
          git add 'projects/第12课_特工身份确认_阳光积木乐园_ppt169_20260906'
          git diff --cached --quiet || { git commit -m 'feat: generate lesson 12 agent identity PPT project'; git push origin HEAD:agent/lesson12-ppt-20260906; }
