          print(report)
          PY
      - name: Preserve build and repair sources inside project notes
        shell: bash
        run: |
          P='projects/第12课_特工身份确认_阳光积木乐园_ppt169_20260906'
          cp .github/scripts/agent_lesson12_build.py "$P/notes/build_deck.py"
          cp .github/scripts/agent_lesson12_fix_schema.py "$P/notes/fix_schema.py"
          cp .github/scripts/agent_lesson12_postprocess.py "$P/notes/postprocess.py"
          cp .github/scripts/agent_lesson12_repair.py "$P/notes/repair.py"
          cp .github/scripts/agent_lesson12_contract_fix.py "$P/notes/contract_fix.py"
      - name: Commit complete repaired project
        shell: bash
        run: |
          git config user.name chatgpt-agent
          git config user.email chatgpt-agent@users.noreply.github.com
          git add 'projects/第12课_特工身份确认_阳光积木乐园_ppt169_20260906'
