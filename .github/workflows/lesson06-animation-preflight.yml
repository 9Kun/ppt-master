name: Lesson06 animation preflight

on:
  push:
    branches:
      - fix/lesson06-code-demo-wps-animations

permissions:
  contents: read

jobs:
  preflight:
    runs-on: ubuntu-latest
    env:
      PROJECT: projects/Python应用课_第06课_阶段测评与复盘_阳光积木实验室_20260905_ppt169_20260905
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: PPT Master attribution guard
        run: python3 skills/ppt-master/scripts/attribution_guard.py
      - name: WPS companion status
        continue-on-error: true
        working-directory: skills/ppt-master-wps-compat
        run: python scripts/maintain.py status
      - name: Prototype one-click WPS serialization
        shell: bash
        run: |
          LATEST=$(find "$PROJECT/exports" -maxdepth 1 -name '*.pptx' -printf '%f\n' | sort | tail -n 1)
          test -n "$LATEST"
          echo "Using baseline export: $LATEST"
          python3 "$PROJECT/tools/wps_fix_code_demo_animations.py" \
            "$PROJECT" "$PROJECT/exports/$LATEST" \
            --output /tmp/lesson06-wps-prototype.pptx
          python3 "$PROJECT/tools/wps_fix_code_demo_animations.py" \
            "$PROJECT" /tmp/lesson06-wps-prototype.pptx --check
          python3 - <<'PY'
          import zipfile
          p = '/tmp/lesson06-wps-prototype.pptx'
          with zipfile.ZipFile(p) as z:
              bad = z.testzip()
              if bad:
                  raise SystemExit(f'bad zip member: {bad}')
              slides = [n for n in z.namelist() if n.startswith('ppt/slides/slide') and n.endswith('.xml')]
              assert len(slides) == 36, len(slides)
          print('ZIP/package smoke check OK: 36 slides')
          PY
