name: Lesson06 animation preflight
on:
  push:
    branches: [fix/lesson06-code-demo-wps-animations]
permissions:
  contents: read
jobs:
  preflight:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Inspect patch points
        shell: bash
        run: |
          echo '=== animation_config ==='
          grep -n -E "slide_cfg|default_animation|unknown|allowed|valid.*field|groups" skills/ppt-master/scripts/svg_to_pptx/animation_config.py | tail -n 180
          echo '=== builder settings ==='
          grep -n -A90 -B10 "def _slide_animation_settings" skills/ppt-master/scripts/svg_to_pptx/pptx_package/builder.py
          echo '=== generated validator ==='
          grep -n -A220 -B10 "validate_generated_animation" skills/ppt-master/scripts/pptx_animations.py | tail -n 260
