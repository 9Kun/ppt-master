name: Rebuild lesson06 P05-P36

on:
  push:
    branches: [revamp-lesson06-p5plus-sunshine-blocks]
    paths:
      - 'projects/Python应用课_第06课_阶段测评与复盘_阳光积木实验室_20260905_ppt169_20260905/.revamp/**'
      - '.github/workflows/revamp-lesson06-p5plus.yml'

permissions:
  contents: write

jobs:
  rebuild:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply P05-P36 redesign
        run: python3 'projects/Python应用课_第06课_阶段测评与复盘_阳光积木实验室_20260905_ppt169_20260905/.revamp/apply_p5plus.py'
      - name: Validate protected pages and SVG XML
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re, xml.etree.ElementTree as ET, json
          p=Path('projects/Python应用课_第06课_阶段测评与复盘_阳光积木实验室_20260905_ppt169_20260905')
          svgs=sorted(p.joinpath('svg_final').glob('*.svg'))
          assert len(svgs) >= 36
          for f in svgs:
              ET.parse(f)
          cfg=json.loads(p.joinpath('animations.json').read_text(encoding='utf-8'))
          ids={f.stem:{e.attrib['id'] for e in ET.parse(f).getroot().iter() if 'id' in e.attrib} for f in svgs}
          for slide, spec in cfg.get('slides',{}).items():
              if slide not in ids: continue
              for group, body in spec.get('groups',{}).items():
                  assert group in ids[slide], (slide, group)
                  for effect in body.get('effects',[]):
                      trigger=effect.get('trigger_shape')
                      if trigger: assert trigger in ids[slide], (slide, trigger)
          print('SVG + animation ID validation passed')
          PY
      - name: Commit rebuilt lesson source
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add 'projects/Python应用课_第06课_阶段测评与复盘_阳光积木实验室_20260905_ppt169_20260905/svg_final' 'projects/Python应用课_第06课_阶段测评与复盘_阳光积木实验室_20260905_ppt169_20260905/animations.json'
          git diff --cached --quiet && exit 0
          git commit -m 'feat(slides): revamp lesson06 P05-P36 in sunshine blocks style'
          git push
