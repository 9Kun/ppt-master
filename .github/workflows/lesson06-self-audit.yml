name: Lesson06 self audit

on:
  push:
    branches:
      - fix/lesson06-self-audit-20260906

permissions:
  contents: write

jobs:
  final-release:
    runs-on: ubuntu-24.04
    env:
      PROJECT: projects/Python应用课_第06课_阶段测评与复盘_阳光积木实验室_20260905_ppt169_20260905
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Attribution guard first
        run: python3 skills/ppt-master/scripts/attribution_guard.py

      - name: Install PPT Master dependencies
        run: python3 -m pip install -r skills/ppt-master/requirements.txt

      - name: Official SVG quality gate
        run: python3 skills/ppt-master/scripts/svg_quality_checker.py "$PROJECT"

      - name: Validate custom animations
        run: python3 skills/ppt-master/scripts/animation_config.py validate "$PROJECT"

      - name: Rebuild svg_final
        shell: bash
        run: |
          set -euo pipefail
          python3 skills/ppt-master/scripts/finalize_svg.py "$PROJECT"
          mkdir -p /tmp/lesson06-final
          cp "$PROJECT/svg_final/12_成功标准先看清.svg" /tmp/lesson06-final/
          cp "$PROJECT/svg_final/16_海龟显隐实验站.svg" /tmp/lesson06-final/
          cp "$PROJECT/svg_final/34_作品验收与同伴建议.svg" /tmp/lesson06-final/
          git checkout HEAD -- "$PROJECT/svg_final"
          cp /tmp/lesson06-final/12_成功标准先看清.svg "$PROJECT/svg_final/"
          cp /tmp/lesson06-final/16_海龟显隐实验站.svg "$PROJECT/svg_final/"
          cp /tmp/lesson06-final/34_作品验收与同伴建议.svg "$PROJECT/svg_final/"

      - name: Canonical final release SVG gate
        run: python3 skills/ppt-master/scripts/svg_quality_checker.py "$PROJECT" --canonical-authoring --stage final --json

      - name: Export fresh native PPTX and apply WPS interaction serializer
        shell: bash
        run: |
          set -euo pipefail
          BEFORE=$(mktemp)
          find "$PROJECT/exports" -maxdepth 1 -type f -name '*.pptx' -printf '%f\n' | sort > "$BEFORE"
          python3 skills/ppt-master/scripts/svg_to_pptx.py "$PROJECT"
          AFTER=$(mktemp)
          find "$PROJECT/exports" -maxdepth 1 -type f -name '*.pptx' -printf '%f\n' | sort > "$AFTER"
          NEW=$(comm -13 "$BEFORE" "$AFTER" | tail -n 1)
          test -n "$NEW"
          INPUT="$PROJECT/exports/$NEW"
          FINAL="$PROJECT/exports/Python应用课_第06课_阶段测评与复盘_阳光积木实验室_20260905_20260906_自检修复_WPS.pptx"
          python3 "$PROJECT/tools/wps_fix_code_demo_animations.py" "$PROJECT" "$INPUT" --output "$FINAL"
          python3 "$PROJECT/tools/wps_fix_code_demo_animations.py" "$PROJECT" "$FINAL" --check
          rm -f "$INPUT"
          echo "FINAL_PPTX=$FINAL" >> "$GITHUB_ENV"

      - name: Verify every click trigger is one interactive sequence
        shell: bash
        run: |
          python3 - "$FINAL_PPTX" <<'PY'
          import sys, zipfile
          from collections import Counter
          from xml.etree import ElementTree as ET
          P='http://schemas.openxmlformats.org/presentationml/2006/main'
          q=lambda n:f'{{{P}}}{n}'
          bad=[]
          with zipfile.ZipFile(sys.argv[1]) as z:
              for n in range(5,37):
                  root=ET.fromstring(z.read(f'ppt/slides/slide{n}.xml'))
                  counts=Counter()
                  for seq in root.iter(q('seq')):
                      ctn=seq.find(q('cTn'))
                      if ctn is None or ctn.get('nodeType')!='interactiveSeq':
                          continue
                      st=ctn.find(q('stCondLst'))
                      if st is None: continue
                      tgt=next(st.iter(q('spTgt')),None)
                      if tgt is not None and tgt.get('spid'):
                          counts[tgt.get('spid')]+=1
                  repeated={k:v for k,v in counts.items() if v>1}
                  if repeated: bad.append((n,repeated))
          if bad:
              raise SystemExit(f'repeated interactive sequences remain: {bad}')
          print('OK: every P05-P36 click trigger has a single interactiveSeq')
          PY

      - name: Validate PPTX package
        shell: bash
        run: |
          python3 - "$FINAL_PPTX" <<'PY'
          import sys, zipfile
          from pptx import Presentation
          path=sys.argv[1]
          with zipfile.ZipFile(path) as z:
              assert z.testzip() is None
              slides=[n for n in z.namelist() if n.startswith('ppt/slides/slide') and n.endswith('.xml')]
              assert len(slides)==36, len(slides)
          prs=Presentation(path)
          assert len(prs.slides)==36
          print(f'OK: native PPTX opens correctly; slides={len(prs.slides)}')
          PY

      - name: Hard-protect P01-P04 and all unrelated svg_output pages
        shell: bash
        run: |
          set -euo pipefail
          git diff --exit-code HEAD -- \
            "$PROJECT/svg_output/01_阶段测评与复盘.svg" \
            "$PROJECT/svg_output/02_今天的120分钟.svg" \
            "$PROJECT/svg_output/03_今天要带走什么.svg" \
            "$PROJECT/svg_output/04_十题热身赛.svg" \
            "$PROJECT/svg_final/01_阶段测评与复盘.svg" \
            "$PROJECT/svg_final/02_今天的120分钟.svg" \
            "$PROJECT/svg_final/03_今天要带走什么.svg" \
            "$PROJECT/svg_final/04_十题热身赛.svg"
          python3 - <<'PY'
          import subprocess
          allowed={
            '12_成功标准先看清.svg',
            '16_海龟显隐实验站.svg',
            '34_作品验收与同伴建议.svg',
          }
          project='projects/Python应用课_第06课_阶段测评与复盘_阳光积木实验室_20260905_ppt169_20260905/svg_output/'
          out=subprocess.check_output(['git','diff','--name-only','HEAD','--',project],text=True)
          bad=[p for p in out.splitlines() if p.rsplit('/',1)[-1] not in allowed]
          if bad: raise SystemExit('unexpected svg_output changes: '+str(bad))
          print('OK: only P12/P16/P34 changed in svg_output')
          PY

      - name: Commit final synchronized pages and PPTX
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            "$PROJECT/svg_final/12_成功标准先看清.svg" \
            "$PROJECT/svg_final/16_海龟显隐实验站.svg" \
            "$PROJECT/svg_final/34_作品验收与同伴建议.svg" \
            "$PROJECT/validation/svg_quality_report.json" \
            "$FINAL_PPTX"
          git commit -m "fix(slides): finalize lesson06 self-audit repairs"
          git push origin HEAD:fix/lesson06-self-audit-20260906
