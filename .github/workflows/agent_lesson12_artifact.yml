name: agent-lesson12-artifact

on:
  push:
    branches: [agent/lesson12-ppt-20260906]
    paths:
      - '.github/workflows/agent_lesson12_artifact.yml'

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/lesson12-ppt-20260906
      - name: Verify deliverable
        shell: bash
        run: |
          P='projects/第12课_特工身份确认_阳光积木乐园_ppt169_20260906/exports/第12课_特工身份确认_阳光积木乐园.pptx'
          test -f "$P"
          python - <<'PY'
          from pathlib import Path
          import zipfile,re
          p=Path('projects/第12课_特工身份确认_阳光积木乐园_ppt169_20260906/exports/第12课_特工身份确认_阳光积木乐园.pptx')
          with zipfile.ZipFile(p) as z:
              slides=[n for n in z.namelist() if re.fullmatch(r'ppt/slides/slide\d+\.xml',n)]
              assert len(slides)==32 and z.testzip() is None
          print(p.stat().st_size)
          PY
      - name: Upload PPTX artifact
        uses: actions/upload-artifact@v4
        with:
          name: lesson12-agent-identity-pptx
          path: projects/第12课_特工身份确认_阳光积木乐园_ppt169_20260906/exports/第12课_特工身份确认_阳光积木乐园.pptx
          if-no-files-found: error
          retention-days: 30
          compression-level: 0
