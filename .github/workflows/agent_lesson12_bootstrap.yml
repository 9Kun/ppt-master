name: agent-lesson12-bootstrap

on:
  push:
    branches:
      - agent/lesson12-ppt-20260906
    paths:
      - '.github/workflows/agent_lesson12_bootstrap.yml'

permissions:
  contents: write

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: agent/lesson12-ppt-20260906
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install DOCX reader
        run: python -m pip install --disable-pip-version-check python-docx

      - name: PPT Master attribution guard
        run: python skills/ppt-master/scripts/attribution_guard.py

      - name: WPS companion status (diagnostic only on ephemeral runner)
        shell: bash
        run: |
          set +e
          python skills/ppt-master-wps-compat/scripts/maintain.py status > /tmp/wps_status.txt 2>&1
          code=$?
          set -e
          echo "status_exit=$code" | tee -a /tmp/wps_status.txt
          cat /tmp/wps_status.txt

      - name: Extract source DOCX into project notes
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          from docx import Document

          src = Path('19课分教案/第12课_特工身份确认.docx')
          project = Path('projects/第12课_特工身份确认_阳光积木乐园_ppt169_20260906')
          notes = project / 'notes'
          notes.mkdir(parents=True, exist_ok=True)

          doc = Document(src)
          out = []
          for i, p in enumerate(doc.paragraphs, 1):
              text = p.text.rstrip()
              if text:
                  out.append(f'[P{i}] {text}')
          for ti, table in enumerate(doc.tables, 1):
              out.append(f'\n[TABLE {ti}]')
              for ri, row in enumerate(table.rows, 1):
                  cells = [c.text.replace('\n', ' / ').strip() for c in row.cells]
                  out.append(f'R{ri}: ' + ' | '.join(cells))

          (notes / 'source_docx.txt').write_text('\n'.join(out), encoding='utf-8')
          (notes / 'wps_status.txt').write_text(Path('/tmp/wps_status.txt').read_text(encoding='utf-8', errors='replace'), encoding='utf-8')
          print(f'extracted paragraphs={len(doc.paragraphs)} tables={len(doc.tables)}')
          PY

      - name: Commit bootstrap notes
        shell: bash
        run: |
          git config user.name 'chatgpt-agent'
          git config user.email 'chatgpt-agent@users.noreply.github.com'
          git add projects/第12课_特工身份确认_阳光积木乐园_ppt169_20260906/notes
          if git diff --cached --quiet; then
            echo 'No bootstrap changes.'
          else
            git commit -m 'chore: bootstrap lesson 12 PPT source notes'
            git push origin HEAD:agent/lesson12-ppt-20260906
          fi
